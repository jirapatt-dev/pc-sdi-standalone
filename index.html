	/* --- NEW LOADING OVERLAY STYLES --- */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; backdrop-filter: blur(8px); transition: opacity 0.3s ease;
        }
        @keyframes progress-stripes {
            from { background-position: 1rem 0, 0 0; }
            to { background-position: 0 0, 0 0; }
        }
        .loading-bar-container {
            width: 320px;
            background-color: #e5e7eb;
            border-radius: 9999px;
            padding: 4px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .loading-progress-bar {
            background-image: 
                linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent),
                linear-gradient(to right, #6366f1, #9333ea);
            background-size: 1rem 1rem, 100% 100%;
            background-repeat: repeat, no-repeat;
            color: white; font-size: 0.75rem; font-weight: bold; text-align: center;
            padding: 6px; line-height: 1; border-radius: 9999px;
            animation: progress-stripes 1s linear infinite;
            transition: width 0.3s ease-out; width: 0%;
        }
        .loading-icon {
            width: 96px; height: 96px; object-fit: contain; margin-bottom: 1rem;
            filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07));
        }
        .loading-text {
            margin-top: 1rem; font-size: 0.875rem; font-weight: bold; color: #64748b;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
		
		
		
	/* --- Animation สำหรับไอคอนหน้าสถิติ --- */
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.15); opacity: 0.4; }
        }
        .animate-icon-float {
            animation: iconFloat 3s ease-in-out infinite;
        }
        .animate-icon-pulse {
            animation: iconPulse 2.5s ease-in-out infinite;

const WEB_APP_URL = &#39;https://script.google.com/macros/s/AKfycbzZRAl1MQZjq7oTeaHJjTIxOF7ThlP0BWHeBNIyGqvAtsIaeBVp6206es9EspSxL4dHsg/exec&#39;;

let allStudents = [];
let filteredData = [];
let currentPage = 1;
let rowsPerPage = 10;
let availableYears = []; // 🟢 เก็บปีการศึกษาที่มีทั้งหมดในระบบ

// --- ระบบแจ้งเตือน Custom Alert ---
let customAlertCallback = null;

function showCustomAlert(title, message, callback = null) {
    customAlertCallback = callback; 
    document.getElementById(&#39;customAlertTitle&#39;).textContent = title;
    document.getElementById(&#39;customAlertMessage&#39;).textContent = message;
    const modal = document.getElementById(&#39;customAlertModal&#39;);
    const content = document.getElementById(&#39;customAlertContent&#39;);
    
    modal.classList.remove(&#39;hidden&#39;);
    setTimeout(() =&gt; {
        content.classList.remove(&#39;scale-95&#39;, &#39;opacity-0&#39;);
        content.classList.add(&#39;scale-100&#39;, &#39;opacity-100&#39;);
    }, 10);
}

function closeCustomAlert() {
    const modal = document.getElementById(&#39;customAlertModal&#39;);
    const content = document.getElementById(&#39;customAlertContent&#39;);
    
    content.classList.remove(&#39;scale-100&#39;, &#39;opacity-100&#39;);
    content.classList.add(&#39;scale-95&#39;, &#39;opacity-0&#39;);
    
    setTimeout(() =&gt; { 
        modal.classList.add(&#39;hidden&#39;); 
        if (typeof customAlertCallback === &#39;function&#39;) {
            customAlertCallback();
            customAlertCallback = null;
        }
    }, 300);
}



function generateCaptcha() {
   const num1 = Math.floor(Math.random() * 10) + 1;
   const num2 = Math.floor(Math.random() * 10) + 1;
   captchaCorrectAnswer = num1 + num2;
   document.getElementById(&#39;captchaQuestion&#39;).textContent = `${num1} + ${num2} =`;
   document.getElementById(&#39;captchaAnswer&#39;).value = &#39;&#39;;
   }

// 🟢 เพิ่มฟังก์ชันสำหรับวาด Tabs อัตโนมัติ (วางต่อจากตัวแปรด้านบนได้เลย)
function renderYearTabs() {
    const container = document.getElementById(&#39;yearTabsContainer&#39;);
    let html = `
        &lt;button id=&quot;tabOverall&quot; onclick=&quot;switchYearTab(&#39;overall&#39;)&quot; class=&quot;px-4 py-2 font-bold text-[#0d6efd] border-b-[3px] border-[#0d6efd] hover:text-blue-700 transition-colors focus:outline-none text-base whitespace-nowrap&quot;&gt;
            สถิติโดยรวม
        &lt;/button&gt;
    `;
    availableYears.forEach(year =&gt; {
        html += `
        &lt;button id=&quot;tabYear${year}&quot; onclick=&quot;switchYearTab(&#39;${year}&#39;)&quot; class=&quot;px-4 py-2 font-bold text-gray-500 border-b-[3px] border-transparent hover:text-gray-700 hover:border-gray-300 transition-colors focus:outline-none text-base whitespace-nowrap&quot;&gt;
            ปี ${year}
        &lt;/button&gt;
        `;
    });
    container.innerHTML = html;
}

async function fetchStudentsData() {
	showLoading(true, &quot;กำลังดึงข้อมูลนักเรียน...&quot;); // 🟢 1. สั่งเปิดโหลด
    try {
        // แสดงสถานะกำลังโหลดบนตาราง
        document.getElementById(&#39;studentTableBody&#39;).innerHTML = `
            &lt;tr&gt;
                &lt;td colspan=&quot;10&quot; class=&quot;py-10 text-center text-blue-600 font-bold text-lg&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-circle-notch fa-spin mr-2&quot;&gt;&lt;/i&gt;กำลังโหลดข้อมูลนักเรียน...
                &lt;/td&gt;
            &lt;/tr&gt;`;

        // ดึงข้อมูลผ่าน Web App
        const response = await fetch(WEB_APP_URL);
        const result = await response.json();
        
        // ตรวจสอบว่ามีข้อมูลกลับมาหรือไม่ (สมมติว่า Google Apps Script คืนค่าเป็น Array of Objects)
        const dataRows = result.data || result; 

        // Map คอลัมน์จาก Sheet สู่ตัวแปรที่ HTML ใช้
		allStudents = dataRows.map((row, index) =&gt; ({
            id: row[&#39;UID&#39;] || index,
            img: row[&#39;รูป&#39;] || &#39;https://via.placeholder.com/150&#39;,
            code: row[&#39;เลขประจำตัว&#39;] ? row[&#39;เลขประจำตัว&#39;].toString() : &#39;&#39;,
            idCard: row[&#39;เลขบัตรประชาชน&#39;] ? row[&#39;เลขบัตรประชาชน&#39;].toString() : &#39;&#39;,
            name: row[&#39;ชื่อ สกุล&#39;] || &#39;&#39;,
            room: row[&#39;ชั้น&#39;] || &#39;&#39;,
            no: row[&#39;เลขที่&#39;] ? row[&#39;เลขที่&#39;].toString() : &#39;&#39;,
            gender: row[&#39;เพศ&#39;] || &#39;&#39;,
            year: row[&#39;ปีที่เข้าศึกษา&#39;] ? row[&#39;ปีที่เข้าศึกษา&#39;].toString() : &#39;&#39;,
			sheetName: row[&#39;sheetName&#39;] || &#39;&#39;, // &lt;-- เพิ่มบรรทัดนี้
            status: row[&#39;สถานะนักเรียน&#39;] || &#39;กำลังศึกษา&#39;,
            statusDate: row[&#39;Date Note&#39;] || &#39;&#39;
        }));

		// 🟢 ดึงปีการศึกษาที่มีทั้งหมดจาก sheetName และเรียงจากล่าสุดไปเก่าสุด
        const uniqueYears = [...new Set(allStudents.map(s =&gt; s.sheetName.replace(&#39;ปี &#39;, &#39;&#39;)))].filter(y =&gt; y.trim() !== &#39;&#39;).sort((a, b) =&gt; b - a);
        availableYears = uniqueYears.length &gt; 0 ? uniqueYears : [&#39;2569&#39;];

        // วาดปุ่ม Tab อัตโนมัติ
        renderYearTabs();

        // 🟢 เปลี่ยนค่าเริ่มต้นให้แสดงรายชื่อของปี &quot;ล่าสุด&quot; อัตโนมัติ
        filteredData = allStudents.filter(s =&gt; s.sheetName === (&#39;ปี &#39; + availableYears[0]));
        
        // อัปเดต UI เมื่อได้ข้อมูลครบแล้ว
        renderTable();
        renderPagination();
        switchYearTab(&#39;overall&#39;); 
        
		// 🟢 เพิ่มบรรทัดนี้ลงไปเพื่อให้แสดงสรุปตอนเปิดหน้าเว็บครั้งแรก 🟢
        updateStudentSummary();
		
        showToast(&#39;โหลดข้อมูลสำเร็จ&#39;, &#39;success&#39;);
		showLoading(false); // 🟢 2. ปิดโหลดเมื่อสำเร็จ

    } catch (error) {
        console.error(&quot;Error fetching data:&quot;, error);
        document.getElementById(&#39;studentTableBody&#39;).innerHTML = `
            &lt;tr&gt;
                &lt;td colspan=&quot;10&quot; class=&quot;py-10 text-center text-red-500 font-bold text-lg&quot;&gt;
                    &lt;i class=&quot;fa-solid fa-triangle-exclamation mr-2&quot;&gt;&lt;/i&gt;ไม่สามารถเชื่อมต่อฐานข้อมูลได้
                &lt;/td&gt;
            &lt;/tr&gt;`;
        showToast(&#39;เกิดข้อผิดพลาดในการดึงข้อมูล&#39;, &#39;error&#39;);
		showLoading(false); // 🟢 3. ปิดโหลดเมื่อเกิดข้อผิดพลาด
    }
}

        function getStatusBadge(status) {
            if (status === &#39;กำลังศึกษา&#39;) return &#39;&lt;span class=&quot;bg-[#83ebbc] text-[#0f5132] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;กำลังศึกษา&lt;/span&gt;&#39;;
            if (status === &#39;ลาออก&#39;) return &#39;&lt;span class=&quot;bg-[#f8d7da] text-[#842029] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;ลาออก&lt;/span&gt;&#39;;
			if (status === &#39;พักการเรียน&#39;) return &#39;&lt;span class=&quot;bg-#fabdb4] text-[#842029] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;พักการเรียน&lt;/span&gt;&#39;;
            if (status === &#39;ย้ายสถานศึกษา&#39;) return &#39;&lt;span class=&quot;bg-[#fff3cd] text-[#664d03] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;ย้ายสถานศึกษา&lt;/span&gt;&#39;;
            if (status === &#39;ขาดเรียนนาน&#39;) return &#39;&lt;span class=&quot;bg-[#ffe5d0] text-[#c2410c] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;ขาดเรียนนาน&lt;/span&gt;&#39;;
            if (status === &#39;สำเร็จการศึกษา&#39;) return &#39;&lt;span class=&quot;bg-[#e7fc7e] text-[#4338ca] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;สำเร็จการศึกษา&lt;/span&gt;&#39;;
            return `&lt;span class=&quot;bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;&gt;${status}&lt;/span&gt;`;
        }

        function renderTable() {
		const tbody = document.getElementById(&#39;studentTableBody&#39;);
		const noDataMsg = document.getElementById(&#39;noDataMessage&#39;);
		tbody.innerHTML = &#39;&#39;;

		if (filteredData.length === 0) {
			noDataMsg.classList.remove(&#39;hidden&#39;);
			return;
		} else {
			noDataMsg.classList.add(&#39;hidden&#39;);
		}

		const startIndex = (currentPage - 1) * rowsPerPage;
		const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
		const dataToShow = filteredData.slice(startIndex, endIndex);

		dataToShow.forEach((student, index) =&gt; {
			// --- 1. จัดการสิทธิ์การแสดงผลคอลัมน์และปุ่ม ---
			// 🟢 แสดงคอลัมน์เลขบัตรประชาชนสำหรับทุกคน
			let idCardTd = `&lt;td class=&quot;py-1 px-2 text-black text-[16px]&quot;&gt;${student.idCard}&lt;/td&gt;`;
			let manageTd = &#39;&#39;;

			// ถ้าไม่ใช่ &#39;user&#39; (หมายถึงเป็น admin หรือ academic) ให้แสดงช่องจัดการ
			if (currentUserRole !== &#39;user&#39;) {
				let deleteBtn = &#39;&#39;;
				if (currentUserRole === &#39;admin&#39;) {
					deleteBtn = `&lt;button onclick=&quot;openDeleteModal(&#39;${student.code}&#39;, &#39;${student.name}&#39;)&quot; class=&quot;w-8 h-8 rounded-full border border-red-400 text-red-600 flex items-center justify-center hover:bg-red-100 transition focus:outline-none&quot; title=&quot;ลบ&quot;&gt;
									&lt;i class=&quot;fa-solid fa-trash-can text-[12px]&quot;&gt;&lt;/i&gt;
								 &lt;/button&gt;`;
				}

				// คอลัมน์จัดการ (รายละเอียด, แก้ไข, ลบ)
				manageTd = `
				&lt;td class=&quot;py-1 px-2 print:hidden&quot;&gt;
					&lt;div class=&quot;flex justify-center items-center gap-1.5&quot;&gt;
						&lt;button onclick=&quot;openImageModal(&#39;${student.code}&#39;)&quot; class=&quot;w-8 h-8 rounded-full border border-gray-400 text-black flex items-center justify-center hover:bg-gray-200 transition focus:outline-none&quot; title=&quot;รายละเอียด&quot;&gt;
							&lt;i class=&quot;fa-solid fa-list text-[12px]&quot;&gt;&lt;/i&gt;
						&lt;/button&gt;
						&lt;button onclick=&quot;openEditModal(&#39;${student.code}&#39;)&quot; class=&quot;w-8 h-8 rounded-full border border-blue-400 text-blue-600 flex items-center justify-center hover:bg-blue-100 transition focus:outline-none&quot; title=&quot;แก้ไข&quot;&gt;
							&lt;i class=&quot;fa-solid fa-pen-to-square text-[12px]&quot;&gt;&lt;/i&gt;
						&lt;/button&gt;
						${deleteBtn}
					&lt;/div&gt;
				&lt;/td&gt;`;
			}

			// --- 2. สร้างแถวข้อมูล ---
			const tr = document.createElement(&#39;tr&#39;);
			tr.className = index % 2 === 0 ? &#39;bg-white hover:bg-gray-50 transition-colors&#39; : &#39;bg-tableAlt hover:bg-gray-100 transition-colors&#39;;
			
			tr.innerHTML = `
				&lt;td class=&quot;py-1 px-2&quot;&gt;
					&lt;img src=&quot;${student.img || &#39;https://via.placeholder.com/150&#39;}&quot; loading=&quot;lazy&quot; alt=&quot;Profile&quot; 
						 class=&quot;w-11 h-11 rounded-full mx-auto object-cover border-2 border-red-500 cursor-pointer transform hover:scale-110 hover:shadow-md hover:border-red-600 transition-all duration-300&quot;
						 onclick=&quot;openImageModal(&#39;${student.code}&#39;)&quot;
						 title=&quot;คลิกเพื่อดูข้อมูลรูปภาพ&quot;&gt;
				&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2 font-bold text-black text-[16px]&quot;&gt;${student.code}&lt;/td&gt;
				${idCardTd} &lt;td class=&quot;py-1 px-3 text-left text-black font-medium text-[16px]&quot;&gt;${student.name}&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2 text-black text-[16px]&quot;&gt;${student.gender}&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2 text-black font-medium text-[16px]&quot;&gt;${student.room}&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2 text-black text-[16px]&quot;&gt;${student.no}&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2 text-black text-[16px]&quot;&gt;${student.year}&lt;/td&gt;
				&lt;td class=&quot;py-1 px-2&quot;&gt;${getStatusBadge(student.status)}&lt;/td&gt;
				${manageTd} `;
			tbody.appendChild(tr);
		});
	}

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const container = document.getElementById(&#39;paginationControls&#39;);
            const info = document.getElementById(&#39;paginationInfo&#39;);
            
            const startIdx = filteredData.length === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const endIdx = Math.min(currentPage * rowsPerPage, filteredData.length);
            info.innerText = `แสดง ${startIdx}-${endIdx} จาก ${filteredData.length}`;

            if (totalPages &lt;= 1) {
                container.innerHTML = &#39;&#39;;
                return;
            }

            let html = `
                &lt;button onclick=&quot;changePage(${currentPage - 1})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition flex items-center gap-1.5 font-medium bg-white disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed&quot; ${currentPage === 1 ? &#39;disabled&#39; : &#39;&#39;}&gt;
                    &lt;i class=&quot;fa-solid fa-chevron-left text-[10px]&quot;&gt;&lt;/i&gt; ก่อนหน้า
                &lt;/button&gt;
            `;

            let startPage = Math.max(1, currentPage - 1);
            let endPage = Math.min(totalPages, currentPage + 1);

            if (startPage &gt; 1) {
                html += `&lt;button onclick=&quot;changePage(1)&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;&gt;1&lt;/button&gt;`;
                if (startPage &gt; 2) html += `&lt;span class=&quot;px-1 text-gray-400&quot;&gt;...&lt;/span&gt;`;
            }

            for (let i = startPage; i &lt;= endPage; i++) {
                if (i === currentPage) {
                    html += `&lt;button class=&quot;px-3 py-1.5 bg-[#0d6efd] border border-[#0d6efd] text-white rounded font-medium shadow-sm&quot;&gt;${i}&lt;/button&gt;`;
                } else {
                    html += `&lt;button onclick=&quot;changePage(${i})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;&gt;${i}&lt;/button&gt;`;
                }
            }

            if (endPage &lt; totalPages) {
                if (endPage &lt; totalPages - 1) html += `&lt;span class=&quot;px-1 text-gray-400&quot;&gt;...&lt;/span&gt;`;
                html += `&lt;button onclick=&quot;changePage(${totalPages})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;&gt;${totalPages}&lt;/button&gt;`;
            }

            html += `
                &lt;button onclick=&quot;changePage(${currentPage + 1})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition flex items-center gap-1.5 font-medium bg-white disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed&quot; ${currentPage === totalPages ? &#39;disabled&#39; : &#39;&#39;}&gt;
                    ถัดไป &lt;i class=&quot;fa-solid fa-chevron-right text-[10px]&quot;&gt;&lt;/i&gt;
                &lt;/button&gt;
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (page &lt; 1 || page &gt; totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }

        // --- ระบบ Filter ---
        function applyFilters() {
            const searchTerm = document.getElementById(&#39;searchInput&#39;).value.toLowerCase();
            const statusFilter = document.getElementById(&#39;statusFilter&#39;).value;
            const roomFilter = document.getElementById(&#39;roomFilter&#39;).value;
            const genderFilter = document.getElementById(&#39;genderFilter&#39;).value;
            const yearFilter = document.getElementById(&#39;yearFilter&#39;).value;

			filteredData = allStudents.filter(student =&gt; {
                const matchSearch = student.name.toLowerCase().includes(searchTerm) || student.code.includes(searchTerm);
                const matchStatus = statusFilter === &quot;&quot; || student.status === statusFilter;
				const matchRoom = roomFilter === &quot;&quot; || (roomFilter.includes(&#39;/&#39;) ? student.room === roomFilter : student.room.includes(roomFilter));
                const matchGender = genderFilter === &quot;&quot; || student.gender === genderFilter;
                const matchYear = yearFilter === &quot;&quot; || student.year === yearFilter;
                
                // 🟢 เพิ่มเงื่อนไขให้กรองเฉพาะข้อมูลที่มาจากชีต ปี 2569 เท่านั้น
                const matchSheet = student.sheetName === &#39;ปี 2569&#39;;
                
                return matchSearch &amp;&amp; matchStatus &amp;&amp; matchRoom &amp;&amp; matchGender &amp;&amp; matchYear &amp;&amp; matchSheet;
            });

            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage &gt; totalPages &amp;&amp; totalPages &gt; 0) {
                currentPage = totalPages;
            } else if (totalPages === 0) {
                currentPage = 1;
            }

            renderTable();
            renderPagination();
			// 🟢 เพิ่มบรรทัดนี้ลงไป 🟢
            updateStudentSummary();
        }

        function resetFilters() {
            document.getElementById(&#39;searchInput&#39;).value = &#39;&#39;;
            document.getElementById(&#39;statusFilter&#39;).value = &#39;&#39;;
            document.getElementById(&#39;roomFilter&#39;).value = &#39;&#39;;
            document.getElementById(&#39;genderFilter&#39;).value = &#39;&#39;;
            document.getElementById(&#39;yearFilter&#39;).value = &#39;&#39;;
            applyFilters();
            showToast(&#39;รีเซตตัวกรองเรียบร้อย&#39;, &#39;info&#39;);
        }

        // --- ระบบ Copy และ Excel ---
        function copyTableData() {
            let text = &quot;รหัส\tเลขบัตรประชาชน\tชื่อ-นามสกุล\tเพศ\tห้อง\tเลขที่\tปีที่เข้าศึกษา\tสถานะ\n&quot;;
            filteredData.forEach(student =&gt; {
                text += `${student.code}\t${student.idCard}\t${student.name}\t${student.gender}\t${student.room}\t${student.no}\t${student.year}\t${student.status}\n`;
            });

            const textarea = document.createElement(&#39;textarea&#39;);
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand(&#39;copy&#39;);
                showToast(&#39;คัดลอกข้อมูลลง Clipboard แล้ว&#39;, &#39;success&#39;);
            } catch (err) {
                showToast(&#39;ไม่สามารถคัดลอกข้อมูลได้&#39;, &#39;error&#39;);
            }
            document.body.removeChild(textarea);
        }

        function exportToExcel() {
            let csv = &quot;\uFEFFรหัส,เลขบัตรประชาชน,ชื่อ-นามสกุล,เพศ,ห้อง,เลขที่,ปีที่เข้า,สถานะ\n&quot;;
            filteredData.forEach(student =&gt; {
                csv += `${student.code},${student.idCard},${student.name},${student.gender},${student.room},${student.no},${student.year},${student.status}\n`;
            });
            const blob = new Blob([csv], { type: &#39;text/csv;charset=utf-8;&#39; });
            const url = URL.createObjectURL(blob);
            const link = document.createElement(&quot;a&quot;);
            link.setAttribute(&quot;href&quot;, url);
            link.setAttribute(&quot;download&quot;, &quot;student_data.csv&quot;);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(&#39;ส่งออกเป็นไฟล์ Excel เรียบร้อย&#39;, &#39;success&#39;);
        }

        // --- ระบบ Modal 1: ดูรูปและรายละเอียด ---
        function openImageModal(code) {
            const student = allStudents.find(s =&gt; s.code === code);
            if(!student) return;

            const modal = document.getElementById(&#39;imageModal&#39;);
            const modalCard = document.getElementById(&#39;modalCard&#39;);
            
            document.getElementById(&#39;modalImage&#39;).src = student.img || &#39;https://via.placeholder.com/150&#39;;
            document.getElementById(&#39;modalName&#39;).innerText = student.name;
            document.getElementById(&#39;modalCodeText&#39;).innerText = `รหัส: ${student.code}`;
            document.getElementById(&#39;modalIdCardText&#39;).innerText = `เลขบัตรประชาชน: ${student.idCard}`;
            
            let statusText = student.status;
            if(student.status !== &#39;กำลังศึกษา&#39; &amp;&amp; student.statusDate) {
                const dateObj = new Date(student.statusDate);
                const thaiMonths = [&#39;มกราคม&#39;, &#39;กุมภาพันธ์&#39;, &#39;มีนาคม&#39;, &#39;เมษายน&#39;, &#39;พฤษภาคม&#39;, &#39;มิถุนายน&#39;, &#39;กรกฎาคม&#39;, &#39;สิงหาคม&#39;, &#39;กันยายน&#39;, &#39;ตุลาคม&#39;, &#39;พฤศจิกายน&#39;, &#39;ธันวาคม&#39;];
                statusText += ` (${dateObj.getDate()} ${thaiMonths[dateObj.getMonth()]} ${dateObj.getFullYear() + 543})`;
            }

            document.getElementById(&#39;modalRoomText&#39;).innerText = `ห้อง ${student.room} | เลขที่ ${student.no} | สถานะ: `;
            
            const statusSpan = document.getElementById(&#39;modalStatusText&#39;);
            statusSpan.innerText = statusText;
            
            if (student.status === &#39;กำลังศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#0f5132]&#39;;
			else if (student.status === &#39;พักการเรียน&#39;) statusSpan.className = &#39;font-bold text-[#842029]&#39;;
            else if (student.status === &#39;ลาออก&#39;) statusSpan.className = &#39;font-bold text-[#842029]&#39;;
            else if (student.status === &#39;ย้ายสถานศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#664d03]&#39;;
            else if (student.status === &#39;ขาดเรียนนาน&#39;) statusSpan.className = &#39;font-bold text-[#c2410c]&#39;;
            else if (student.status === &#39;สำเร็จการศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#4338ca]&#39;;
            
            modal.classList.remove(&#39;hidden&#39;);
            modal.classList.add(&#39;flex&#39;);
            setTimeout(() =&gt; {
                modal.classList.remove(&#39;opacity-0&#39;);
                modalCard.classList.remove(&#39;scale-95&#39;);
                modalCard.classList.add(&#39;scale-100&#39;);
            }, 10);
        }

        function closeImageModal() {
            const modal = document.getElementById(&#39;imageModal&#39;);
            const modalCard = document.getElementById(&#39;modalCard&#39;);
            modal.classList.add(&#39;opacity-0&#39;);
            modalCard.classList.remove(&#39;scale-100&#39;);
            modalCard.classList.add(&#39;scale-95&#39;);
            setTimeout(() =&gt; {
                modal.classList.add(&#39;hidden&#39;);
                modal.classList.remove(&#39;flex&#39;);
            }, 300);
        }

        // --- ระบบอัปโหลด/เปลี่ยนรูปภาพ ---
        document.getElementById(&#39;editImageUpload&#39;).addEventListener(&#39;change&#39;, function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById(&#39;editImagePreview&#39;).src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });
        document.getElementById(&#39;addImageUpload&#39;).addEventListener(&#39;change&#39;, function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {

function processExcelFile() {
            const year = document.getElementById(&#39;importYearInput&#39;).value.trim();
            const fileInput = document.getElementById(&#39;realImportFile&#39;);
            const file = fileInput.files[0];

            if (!year) {
                showToast(&#39;กรุณากำหนดปีการศึกษา&#39;, &#39;error&#39;);
                return;
            }
            if (!file) {
                showToast(&#39;กรุณาอัปโหลดไฟล์ Excel หรือ CSV&#39;, &#39;error&#39;);
                return;
            }

            // 🟢 สั่งแสดง Loading ทันทีที่เริ่มอ่านไฟล์
            showLoading(true, &quot;กำลังประมวลผลและตรวจสอบไฟล์...&quot;);

            // อ่านไฟล์ Excel ด้วย SheetJS
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: &#39;array&#39;});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // แปลงข้อมูลเป็น JSON (ข้ามแถวแรกที่เป็น Header)
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (json.length === 0) {
                        showLoading(false); // 🟢 ปิด Loading กรณีข้อมูลว่างเปล่า
                        showToast(&#39;ไม่พบข้อมูลนักเรียนในไฟล์&#39;, &#39;error&#39;);
                        return;
                    }

                    pendingImportData = json;
                    pendingImportYear = year;
                    
                    showLoading(false); // 🟢 ปิด Loading เมื่อตรวจสอบไฟล์สำเร็จพร้อมแสดงหน้าต่างยืนยัน

                    // ปิด Modal แรก และเปิด Modal ยืนยัน
                    closeImportModal();
                    openConfirmImportModal(json.length, year);

                } catch (error) {
                    showLoading(false); // 🟢 ปิด Loading เมื่อเกิดข้อผิดพลาด
                    showToast(&#39;เกิดข้อผิดพลาดในการอ่านไฟล์&#39;, &#39;error&#39;);
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

// --- ฟังก์ชันที่ 1: ตารางรายปี (แยกตามห้องเรียน แบบดั้งเดิม) ---
function renderDynamicTable(studentsInYear) {
    let counts = { 1: Array(15).fill(0), 2: Array(15).fill(0), 3: Array(15).fill(0), 4: Array(15).fill(0), 5: Array(15).fill(0), 6: Array(15).fill(0) };
    studentsInYear.forEach(s =&gt; {
        let match = s.room.match(/ม\.(\d)\/(\d+)/);
        if (match) {
            let level = parseInt(match[1]);
            let room = parseInt(match[2]);
            if (level &gt;= 1 &amp;&amp; level &lt;= 6 &amp;&amp; room &gt;= 1 &amp;&amp; room &lt;= 14) counts[level][room]++;
        }
    });

    function getRowHtml(label, levels, trClass, tdPy, labelClass, totalClass) {
        let totalAll = 0, roomTotals = Array(15).fill(0);
        levels.forEach(l =&gt; { for(let r = 1; r &lt;= 14; r++) { roomTotals[r] += counts[l][r]; totalAll += counts[l][r]; } });
        let html = `&lt;tr class=&quot;${trClass}&quot;&gt;&lt;td class=&quot;${tdPy} px-2 ${labelClass}&quot;&gt;${label}&lt;/td&gt;&lt;td class=&quot;${tdPy} px-2 ${totalClass}&quot;&gt;${totalAll &gt; 0 ? totalAll : &#39;-&#39;}&lt;/td&gt;`;
        for(let r = 1; r &lt;= 14; r++) html += `&lt;td class=&quot;${tdPy} px-2&quot;&gt;${roomTotals[r] &gt; 0 ? roomTotals[r] : &#39;-&#39;}&lt;/td&gt;`;
        return html + `&lt;/tr&gt;`;
    }

    let tbodyHtml = &#39;&#39;;
    tbodyHtml += getRowHtml(&#39;ม.1&#39;, [1], &#39;bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors&#39;, &#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;ม.2&#39;, [2], &#39;bg-[#ffffb3] text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors&#39;, &#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;ม.3&#39;, [3], &#39;bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors&#39;, &#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;รวม ม.1-3&#39;, [1,2,3], &#39;bg-[#9af166] text-[#000000] font-bold border-b border-gray-300 hover:bg-orange-300 transition-colors&#39;, &#39;py-3&#39;, &#39;font-bold&#39;);
    tbodyHtml += getRowHtml(&#39;ม.4&#39;, [4], &#39;bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors&#39;, &#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;ม.5&#39;, [5], &#39;bg-[#ffffb3] text-[#000000] hover:bg-orange-300 transition-colors&#39;,&#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;ม.6&#39;, [6], &#39;bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors&#39;, &#39;py-2.5&#39;, &#39;font-bold&#39;, &#39;font-bold text-blue-600&#39;);
    tbodyHtml += getRowHtml(&#39;รวม ม.4-6&#39;, [4,5,6], &#39;bg-[#9af166] text-[#000000] font-bold border-b border-gray-300 hover:bg-orange-300 transition-colors&#39;, &#39;py-3&#39;, &#39;font-bold&#39;);
    tbodyHtml += getRowHtml(&#39;รวม ม.1-6&#39;, [1,2,3,4,5,6], &#39;bg-yellow-300 text-[#000000] font-bold text-[15px]&#39;, &#39;py-3.5&#39;, &#39;&#39;, &#39;text-lg&#39;);

    document.getElementById(&#39;dynamicTableBody&#39;).innerHTML = tbodyHtml;
}

// --- ฟังก์ชันที่ 2: ตารางสถิติโดยรวม (แยกตามปีการศึกษาและเพศ) ---
function renderOverallTable() {
    // 🟢 เรียงปีจากน้อยไปมากสำหรับแสดงในตารางให้ดูง่าย
    const years = availableYears.slice().sort((a, b) =&gt; a - b);
    const activeStatuses = [&#39;กำลังศึกษา&#39;, &#39;พักการเรียน&#39;, &#39;ขาดเรียนนาน&#39;, &#39;สำเร็จการศึกษา&#39;];
    let tbodyHtml = &#39;&#39;;
    
    // 🟢 เพิ่มตัวแปรเก็บยอดรวมทั้งหมด (Grand Total) แยกชาย-หญิง
    let grandTotal = 0;
    let grandMaleTotal = 0;
    let grandFemaleTotal = 0;
    let colTotals = { 1: { m:0, f:0, t:0 }, 2: { m:0, f:0, t:0 }, 3: { m:0, f:0, t:0 }, 4: { m:0, f:0, t:0 }, 5: { m:0, f:0, t:0 }, 6: { m:0, f:0, t:0 } };

    years.forEach(year =&gt; {
        let studentsInYear = allStudents.filter(s =&gt; s.sheetName === (&#39;ปี &#39; + year) &amp;&amp; activeStatuses.includes(s.status));
        let levelData = { 1: { m:0, f:0 }, 2: { m:0, f:0 }, 3: { m:0, f:0 }, 4: { m:0, f:0 }, 5: { m:0, f:0 }, 6: { m:0, f:0 } };

        studentsInYear.forEach(s =&gt; {
            let match = s.room.match(/ม\.(\d)/); 
            if (match) {
                let level = parseInt(match[1]);
                if (level &gt;= 1 &amp;&amp; level &lt;= 6) {
                    if (s.gender === &#39;ชาย&#39;) levelData[level].m++;
                    if (s.gender === &#39;หญิง&#39;) levelData[level].f++;
                }
            }
        });

        tbodyHtml += `&lt;tr class=&quot;hover:bg-gray-50 transition-colors border-b border-gray-200&quot;&gt;`;
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center text-gray-800&quot;&gt;${year}&lt;/td&gt;`;
        
        let rowHtml = &#39;&#39;;
        
        // 🟢 เพิ่มตัวแปรเก็บยอดรวมเฉพาะปี แยกชาย-หญิง
        let yearTotal = 0;
        let yearMaleTotal = 0;
        let yearFemaleTotal = 0;

        for (let i = 1; i &lt;= 6; i++) {
            let m = levelData[i].m; let f = levelData[i].f; let t = m + f;
            
            // สะสมยอดรวมของปีนั้น
            yearMaleTotal += m;
            yearFemaleTotal += f;
            yearTotal += t; 
            
            colTotals[i].m += m; colTotals[i].f += f; colTotals[i].t += t;
            rowHtml += `&lt;td class=&quot;py-2 px-2 text-center&quot;&gt;${m &gt; 0 ? m : &#39;&#39;}&lt;/td&gt;&lt;td class=&quot;py-2 px-2 text-center&quot;&gt;${f &gt; 0 ? f : &#39;&#39;}&lt;/td&gt;&lt;td class=&quot;py-2 px-2 text-center font-bold bg-gray-50/50&quot;&gt;${t &gt; 0 ? t : &#39;&#39;}&lt;/td&gt;`;
        }
        
        // สะสมยอดรวมทั้งหมด (Grand Total) ของทุกปี
        grandMaleTotal += yearMaleTotal;
        grandFemaleTotal += yearFemaleTotal;
        grandTotal += yearTotal;

        // ใส่ยอดรวมด้านซ้ายสุด
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center font-bold text-blue-600&quot;&gt;${yearTotal &gt; 0 ? yearTotal : &#39;&#39;}&lt;/td&gt;`;
        // ใส่ข้อมูล ม.1-6 ตรงกลาง
        tbodyHtml += rowHtml;
        
        // 🟢 ใส่ช่องสรุป &quot;รวม ม.1-6&quot; ท้ายสุด แยกชาย-หญิง
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center font-bold text-blue-800 bg-blue-50&quot;&gt;${yearMaleTotal &gt; 0 ? yearMaleTotal : &#39;&#39;}&lt;/td&gt;`;
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center font-bold text-blue-800 bg-blue-50&quot;&gt;${yearFemaleTotal &gt; 0 ? yearFemaleTotal : &#39;&#39;}&lt;/td&gt;`;
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center font-bold text-blue-900 bg-blue-100&quot;&gt;${yearTotal &gt; 0 ? yearTotal : &#39;&#39;}&lt;/td&gt;`;
        
        tbodyHtml += `&lt;/tr&gt;`;
    });

    // 🟢 สร้างแถว &quot;รวม&quot; ด้านล่างสุด (สีเหลือง)
    tbodyHtml += `&lt;tr class=&quot;bg-[#fcd34d] font-bold border-b border-black&quot;&gt;`;
    tbodyHtml += `&lt;td class=&quot;py-3 px-2 text-center text-black&quot;&gt;รวม&lt;/td&gt;&lt;td class=&quot;py-3 px-2 text-center text-black bg-[#fbbf24] text-lg&quot;&gt;${grandTotal &gt; 0 ? grandTotal : &#39;&#39;}&lt;/td&gt;`;
    
    for (let i = 1; i &lt;= 6; i++) {
        tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center text-black&quot;&gt;${colTotals[i].m &gt; 0 ? colTotals[i].m : &#39;&#39;}&lt;/td&gt;&lt;td class=&quot;py-2 px-2 text-center text-black&quot;&gt;${colTotals[i].f &gt; 0 ? colTotals[i].f : &#39;&#39;}&lt;/td&gt;&lt;td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;&gt;${colTotals[i].t &gt; 0 ? colTotals[i].t : &#39;&#39;}&lt;/td&gt;`;
    }
    
    // 🟢 ใส่ช่องสรุป &quot;รวม ม.1-6&quot; ของแถวท้ายสุด (สีเหลืองเข้ม)
    tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;&gt;${grandMaleTotal &gt; 0 ? grandMaleTotal : &#39;&#39;}&lt;/td&gt;`;
    tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;&gt;${grandFemaleTotal &gt; 0 ? grandFemaleTotal : &#39;&#39;}&lt;/td&gt;`;
    tbodyHtml += `&lt;td class=&quot;py-2 px-2 text-center text-black bg-[#f59e0b] text-lg&quot;&gt;${grandTotal &gt; 0 ? grandTotal : &#39;&#39;}&lt;/td&gt;`;
    
    tbodyHtml += `&lt;/tr&gt;`;

    document.getElementById(&#39;overallTableBody&#39;).innerHTML = tbodyHtml;
}



		
function switchYearTab(selectedYear) {
    const tabs = [&#39;overall&#39;, ...availableYears]; 
    
    tabs.forEach(tabId =&gt; {
        const tab = document.getElementById(tabId === &#39;overall&#39; ? &#39;tabOverall&#39; : &#39;tabYear&#39; + tabId);
        if (!tab) return;
        
        if (tabId === selectedYear) {
            tab.classList.add(&#39;text-[#0d6efd]&#39;, &#39;border-[#0d6efd]&#39;);
            tab.classList.remove(&#39;text-gray-500&#39;, &#39;border-transparent&#39;);
        } else {
            tab.classList.add(&#39;text-gray-500&#39;, &#39;border-transparent&#39;);
            tab.classList.remove(&#39;text-[#0d6efd]&#39;, &#39;border-[#0d6efd]&#39;);
        }
    });

    const activeStatuses = [&#39;กำลังศึกษา&#39;, &#39;พักการเรียน&#39;, &#39;ขาดเรียนนาน&#39;, &#39;สำเร็จการศึกษา&#39;];
    let studentsToShow = [];

    if (selectedYear === &#39;overall&#39;) {

		// --- ฟังก์ชันควบคุม Loading Overlay ---
		let loadingInterval; 
		function showLoading(show, text = &quot;กำลังโหลดข้อมูล...&quot;) {
			const overlay = document.getElementById(&#39;loading-overlay&#39;);
			const bar = document.getElementById(&#39;loading-progress-bar&#39;);
			const msg = document.getElementById(&#39;loading-text-msg&#39;);

			if (show) {
				if (msg) msg.innerText = text;
				if (overlay) overlay.style.display = &#39;flex&#39;;
				
				let width = 0;
				if (bar) { bar.style.width = &#39;0%&#39;; bar.innerText = &#39;0%&#39;; }
				if (loadingInterval) clearInterval(loadingInterval);
				
				loadingInterval = setInterval(() =&gt; {
					if (width &lt; 90) width += Math.random() * 5;
					else if (width &lt; 98) width += 0.2;
					if (bar) { bar.style.width = width + &#39;%&#39;; bar.innerText = Math.round(width) + &#39;%&#39;; }
				}, 200);
			} else {
				if (loadingInterval) clearInterval(loadingInterval);
				if (bar) { bar.style.width = &#39;100%&#39;; bar.innerText = &#39;100%&#39;; }
				setTimeout(() =&gt; { if (overlay) overlay.style.display = &#39;none&#39;; }, 500);
			}
		}
		
		let currentUserRole = &#39;&#39;;
		let currentUserName = &#39;&#39;;

		// 1. ฟังก์ชัน Login
		async function submitAdminLogin() {
			const user = document.getElementById(&#39;adminUsername&#39;).value.trim();
			const pass = document.getElementById(&#39;adminPassword&#39;).value.trim();
			const captchaInput = document.getElementById(&#39;captchaAnswer&#39;).value.trim();
			const ans = parseInt(captchaInput, 10);
			
			if(!user || !pass) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วน&quot;); 
				return;
			}

			if (captchaInput === &#39;&#39;) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณากรอกคำตอบ Captcha&quot;);
				return;
			}
			if (ans !== captchaCorrectAnswer) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;ผลลัพธ์ Captcha ไม่ถูกต้อง กรุณาลองใหม่&quot;);
				generateCaptcha(); 
				return;
			}
			
			showLoading(true, &quot;กำลังเข้าสู่ระบบ...&quot;); 
			
			try {
				const response = await fetch(WEB_APP_URL, {
					method: &#39;POST&#39;,
					body: JSON.stringify({ action: &#39;login&#39;, username: user, password: pass, token: sessionStorage.getItem(&#39;token&#39;) }) 
				});
				const result = await response.json();
				
				if (result.status === &#39;success&#39;) {
					// บันทึกสถานะ Session
					sessionStorage.setItem(&#39;isLoggedIn&#39;, &#39;true&#39;);
					sessionStorage.setItem(&#39;role&#39;, result.data.role);
					sessionStorage.setItem(&#39;name&#39;, result.data.name);
					sessionStorage.setItem(&#39;token&#39;, result.data.token); // 👈 เพิ่มบรรทัดนี้
					
					// ระบบจำการเข้าสู่ระบบ (Remember Me) ลง LocalStorage
					const isRemember = document.getElementById(&#39;rememberMe&#39;).checked;
					if (isRemember) {
						localStorage.setItem(&#39;savedUser&#39;, user);
						localStorage.setItem(&#39;savedPass&#39;, pass);
						localStorage.setItem(&#39;isRememberMe&#39;, &#39;true&#39;);
					} else {
						localStorage.removeItem(&#39;savedUser&#39;);
						localStorage.removeItem(&#39;savedPass&#39;);
						localStorage.setItem(&#39;isRememberMe&#39;, &#39;false&#39;);
					}
					
					currentUserRole = result.data.role;
					currentUserName = result.data.name;
					
					// อัปเดต UI ส่วนหัว
					document.getElementById(&#39;topAdminName&#39;).textContent = currentUserName; 
					document.getElementById(&#39;marqueeAdminName&#39;).textContent = currentUserName;

			try {
				const response = await fetch(WEB_APP_URL, {
					method: &#39;POST&#39;, mode: &#39;cors&#39;,

				});

                // 🟢 เปลี่ยนจาก hideLoading() เป็น showLoading(false)

				}
			} catch (e) {
                // 🟢 เปลี่ยนจาก hideLoading() เป็น showLoading(false)
				showLoading(false);
				showCustomAlert(&quot;ข้อผิดพลาด&quot;, &quot;เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว&quot;);

		// 3. เริ่มนับถอยหลัง 3 นาที
		function startOTPTimer() {
			clearInterval(otpTimerInterval);
			otpTimeLeft = 180;
			updateTimerDisplay();

			otpTimerInterval = setInterval(() =&gt; {
				otpTimeLeft--;
				updateTimerDisplay();
				if (otpTimeLeft &lt;= 0) {
					clearInterval(otpTimerInterval);
					document.getElementById(&#39;otpTimerDisplay&#39;).textContent = &quot;หมดเวลา&quot;;
					// บังคับให้เริ่มขอใหม่
					showCustomAlert(&quot;หมดเวลา&quot;, &quot;รหัส OTP หมดอายุ กรุณาขอรับรหัสใหม่&quot;, cancelOTP);
				}
			}, 1000);
		}

		function updateTimerDisplay() {
			const m = Math.floor(otpTimeLeft / 60).toString().padStart(2, &#39;0&#39;);
			const s = (otpTimeLeft % 60).toString().padStart(2, &#39;0&#39;);
			document.getElementById(&#39;otpTimerDisplay&#39;).textContent = `${m}:${s}`;
		}

		}

		// 3. ฟังก์ชันดึงข้อมูลไฟล์และเรนเดอร์ตาราง (เรียงปีล่าสุดขึ้นก่อน)
		async function fetchFileListData() {
			showLoading(true, &quot;กำลังดึงข้อมูลไฟล์...&quot;); 
			
			try {
				// ยิงคำสั่งไปที่ Google Apps Script
				const response = await fetch(WEB_APP_URL, {
					method: &#39;POST&#39;,
					body: JSON.stringify({ action: &#39;get_files&#39;, token: sessionStorage.getItem(&#39;token&#39;) })
				});
				const result = await response.json();
				
				if (result.status === &#39;success&#39;) {
					// แปลงข้อมูลที่ได้จาก Backend ให้อยู่ในรูปแบบที่ตารางต้องการ
					savedFilesList = result.data.map(item =&gt; {
						
						// แยกไฟล์ลิงก์ที่ถูกรวมไว้ด้วย \n ออกมา
						let linksStr = item.filesStr ? item.filesStr.toString().split(&#39;\n&#39;) : [];
						let filesArr = [];
						let externalLink = &#39;&#39;;
						
						linksStr.forEach(l =&gt; {
							let link = l.trim();
							if(link !== &#39;&#39;) {
								// ถ้าเป็นลิงก์ Drive ให้ถือว่าเป็นไฟล์แนบ ถ้าไม่ใช่ให้ถือว่าเป็นลิงก์ภายนอก
								if(link.includes(&#39;drive.google&#39;)) {
									filesArr.push({ name: &#39;ดาวน์โหลด&#39;, url: link });
								} else {
									externalLink = link;
								}
							}
						});

						return {
							id: item.id,
							year: item.year,
							date: item.date,
							recorder: item.recorder,
							link: externalLink,
							files: filesArr
						};
					});

					// เรียงข้อมูลตามปีจากมากไปน้อย
					savedFilesList.sort((a, b) =&gt; b.year - a.year);
					renderFileListTable();
				} else {
					showToast(&#39;ดึงข้อมูลไฟล์ล้มเหลว&#39;, &#39;error&#39;);
				}
			} catch (error) {
				console.error(&quot;Error fetching file list:&quot;, error);

		async function submitUploadFile() {
			const id = document.getElementById(&#39;editFileId&#39;).value;
			const year = document.getElementById(&#39;uploadFileYear&#39;).value;
			const date = document.getElementById(&#39;uploadFileDate&#39;).value;
			const recorder = document.getElementById(&#39;uploadFileRecorder&#39;).value;
			const fileInput = document.getElementById(&#39;uploadFileInput&#39;);
			const link = document.getElementById(&#39;uploadFileLink&#39;).value;

			if (!year || !date || (fileInput.files.length === 0 &amp;&amp; !link)) {
				showToast(&#39;กรุณากรอกปี วันที่ และแนบไฟล์/ลิงก์ ให้ครบถ้วน&#39;, &#39;error&#39;);
				return;
			}

			showLoading(true, &quot;กำลังบันทึกข้อมูลและอัปโหลดไฟล์...&quot;);

			let filesArray = [];

			// 1. แปลงไฟล์ที่แนบให้เป็นรูปแบบ Base64
			if (fileInput.files.length &gt; 0) {
				for (let i = 0; i &lt; fileInput.files.length; i++) {
					let file = fileInput.files[i];
					let base64 = await new Promise((resolve) =&gt; {
						let reader = new FileReader();
						reader.onload = (e) =&gt; resolve(e.target.result);
						reader.readAsDataURL(file);
					});
					filesArray.push({
						name: file.name,
						mimeType: file.type,
						base64: base64
					});
				}
			}

			// 2. ส่งข้อมูลไปบันทึกลง Google Apps Script
			try {
				const response = await fetch(WEB_APP_URL, {
					method: &#39;POST&#39;,
					body: JSON.stringify({
						action: &#39;upload_file&#39;,
						id: id,
						year: year,
						date: date,
						recorder: recorder,
						link: link,
						files: filesArray,
						token: sessionStorage.getItem(&#39;token&#39;)
					})
				});

				const result = await response.json();

				if (result.status === &#39;success&#39;) {
					closeUploadFileModal();
					fetchFileListData(); // ดึงข้อมูลใหม่จากฐานข้อมูลมาแสดง
					showToast(&#39;บันทึกข้อมูลเรียบร้อยแล้ว&#39;, &#39;success&#39;);
				} else {
					showToast(&#39;เกิดข้อผิดพลาด: &#39; + result.message, &#39;error&#39;);
				}
			} catch (error) {
				console.error(error);
				showToast(&#39;ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้&#39;, &#39;error&#39;);
			} finally {
				showLoading(false);
			}
		}

        function executeGlobalSearch() {
            const keyword = document.getElementById(&#39;globalSearchInput&#39;).value.trim().toLowerCase();
            const resultContainer = document.getElementById(&#39;globalSearchResult&#39;);
            resultContainer.innerHTML = &#39;&#39;;
            
            if (!keyword) {
                resultContainer.innerHTML = &#39;&lt;p class=&quot;text-red-500 text-sm text-center py-2&quot;&gt;กรุณาระบุคำค้นหา&lt;/p&gt;&#39;;
                resultContainer.classList.remove(&#39;hidden&#39;);
                resultContainer.classList.add(&#39;flex&#39;);
                return;
            }

            // ค้นหาในฐานข้อมูล allStudents ด้วย ชื่อ นามสกุล หรือรหัสนักเรียน
            const found = allStudents.filter(s =&gt; 
                s.name.toLowerCase().includes(keyword) || 
                s.code.includes(keyword)
            );

            if (found.length === 0) {
                resultContainer.innerHTML = &#39;&lt;p class=&quot;text-gray-500 text-sm text-center py-4&quot;&gt;ไม่พบข้อมูลนักเรียนที่ค้นหา&lt;/p&gt;&#39;;
            } else if (found.length === 1) {
                // ถ้าค้นเจอแค่ 1 คน เปิดรายละเอียดทันที
                closeGlobalSearchModal();
                showSearchDetailModal(found[0]);
                return; 
            } else {
                // ถ้าค้นเจอหลายคน สร้างลิสต์ให้ผู้ใช้คลิกเลือก
                found.forEach(s =&gt; {
                    const div = document.createElement(&#39;div&#39;);
                    div.className = &quot;flex items-center justify-between bg-gray-50 border border-gray-200 p-3 rounded-lg cursor-pointer hover:bg-purple-50 transition-colors&quot;;
                    div.onclick = () =&gt; {
                        closeGlobalSearchModal();
                        showSearchDetailModal(s);
                    };
                    div.innerHTML = `
                        &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                            &lt;img src=&quot;${s.img || &#39;https://via.placeholder.com/150&#39;}&quot; class=&quot;w-10 h-10 rounded-full object-cover&quot;&gt;
                            &lt;div&gt;
                                &lt;p class=&quot;font-bold text-gray-800 text-sm&quot;&gt;${s.name}&lt;/p&gt;
                                &lt;p class=&quot;text-xs text-gray-500&quot;&gt;รหัส: ${s.code} | ห้อง: ${s.room}&lt;/p&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                        &lt;i class=&quot;fa-solid fa-chevron-right text-purple-400&quot;&gt;&lt;/i&gt;
                    `;
                    resultContainer.appendChild(div);
                });
            }
            resultContainer.classList.remove(&#39;hidden&#39;);
            resultContainer.classList.add(&#39;flex&#39;);
        }

        // --- ระบบแสดงผลลัพธ์พร้อมปิดบัง 4 ตัวท้าย (Masked ID Card) ---
        function showSearchDetailModal(student) {
            const modal = document.getElementById(&#39;searchDetailModal&#39;);
            const card = document.getElementById(&#39;searchDetailModalCard&#39;);
            
            document.getElementById(&#39;sdImage&#39;).src = student.img || &#39;https://via.placeholder.com/150&#39;;
            document.getElementById(&#39;sdName&#39;).innerText = student.name;
            document.getElementById(&#39;sdCodeText&#39;).innerText = `รหัส: ${student.code}`;
            
            // แปลงเลขบัตรประชาชนให้ 4 ตัวท้ายเป็น xxxx
            let maskedId = student.idCard;
            if (maskedId &amp;&amp; maskedId.length &gt;= 4) {
                maskedId = maskedId.substring(0, maskedId.length - 4) + &#39;xxxx&#39;;
            } else {
                maskedId = &#39;ไม่มีข้อมูล&#39;;
            }
            document.getElementById(&#39;sdIdCardText&#39;).innerText = `เลขบัตรประชาชน: ${maskedId}`;
            
            let statusText = student.status;
            if(student.status !== &#39;กำลังศึกษา&#39; &amp;&amp; student.statusDate) {
                const dateObj = new Date(student.statusDate);
                const thaiMonths = [&#39;มกราคม&#39;, &#39;กุมภาพันธ์&#39;, &#39;มีนาคม&#39;, &#39;เมษายน&#39;, &#39;พฤษภาคม&#39;, &#39;มิถุนายน&#39;, &#39;กรกฎาคม&#39;, &#39;สิงหาคม&#39;, &#39;กันยายน&#39;, &#39;ตุลาคม&#39;, &#39;พฤศจิกายน&#39;, &#39;ธันวาคม&#39;];
                statusText += ` (${dateObj.getDate()} ${thaiMonths[dateObj.getMonth()]} ${dateObj.getFullYear() + 543})`;
            }

            document.getElementById(&#39;sdRoomText&#39;).innerText = `ห้อง ${student.room} | เลขที่ ${student.no} | สถานะ: `;
            
            const statusSpan = document.getElementById(&#39;sdStatusText&#39;);
            statusSpan.innerText = statusText;
            
            // ใช้ Badge สีเดียวกับตารางหลัก
            if (student.status === &#39;กำลังศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#0f5132]&#39;;
            else if (student.status === &#39;พักการเรียน&#39;) statusSpan.className = &#39;font-bold text-[#842029]&#39;;
            else if (student.status === &#39;ลาออก&#39;) statusSpan.className = &#39;font-bold text-[#842029]&#39;;
            else if (student.status === &#39;ย้ายสถานศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#664d03]&#39;;
            else if (student.status === &#39;ขาดเรียนนาน&#39;) statusSpan.className = &#39;font-bold text-[#c2410c]&#39;;
            else if (student.status === &#39;สำเร็จการศึกษา&#39;) statusSpan.className = &#39;font-bold text-[#4338ca]&#39;;
            
            modal.classList.remove(&#39;hidden&#39;);
            modal.classList.add(&#39;flex&#39;);
            setTimeout(() =&gt; {
                modal.classList.remove(&#39;opacity-0&#39;);
                card.classList.remove(&#39;scale-95&#39;);
                card.classList.add(&#39;scale-100&#39;);
            }, 10);
        }

        function closeSearchDetailModal() {
            const modal = document.getElementById(&#39;searchDetailModal&#39;);
            const card = document.getElementById(&#39;searchDetailModalCard&#39;);
            modal.classList.add(&#39;opacity-0&#39;);
            card.classList.remove(&#39;scale-100&#39;);
            card.classList.add(&#39;scale-95&#39;);
            setTimeout(() =&gt; {
                modal.classList.add(&#39;hidden&#39;);
                modal.classList.remove(&#39;flex&#39;);
            }, 300);
        }

					if (data.name === sessionStorage.getItem(&#39;name&#39;)) {
						roleInput.disabled = true;
						roleInput.classList.add(&#39;bg-gray-100&#39;, &#39;cursor-not-allowed&#39;, &#39;pointer-events-none&#39;);
					} else {
						roleInput.disabled = false;
						roleInput.classList.remove(&#39;bg-gray-100&#39;, &#39;cursor-not-allowed&#39;, &#39;pointer-events-none&#39;);
					}
					
					document.getElementById(&#39;editAdminEmailInput&#39;).value = data.email || &#39;&#39;;
					document.getElementById(&#39;editAdminImageUrl&#39;).value = data.image || &#39;&#39;;
					document.getElementById(&#39;editAdminImagePreview&#39;).src = data.image || &#39;https://via.placeholder.com/150&#39;;

					// ตั้งค่าปุ่มบันทึกกลับไปใช้ฟังก์ชัน Update เดิม แต่อัปเดตตารางต่อ
					const saveBtn = document.querySelector(&#39;#editAdminCard button.bg-green-600&#39;);
					saveBtn.setAttribute(&#39;onclick&#39;, &#39;submitEditAdminInfoForManage()&#39;);

					const modal = document.getElementById(&#39;editAdminModal&#39;);
					const card = document.getElementById(&#39;editAdminCard&#39;);
					modal.classList.remove(&#39;hidden&#39;);
					modal.classList.add(&#39;flex&#39;);
					setTimeout(() =&gt; { card.classList.remove(&#39;scale-95&#39;); card.classList.add(&#39;scale-100&#39;); }, 10);
				}
			});
		}

		function submitEditAdminInfoForManage() {
			// ใช้คำสั่งอัปเดตคล้ายของเดิม แต่เสริมการ Fetch ตารางหลังจากจบ
			submitEditAdminInfo();
			setTimeout(() =&gt; fetchAdminList(), 1500); // ดีเลย์โหลดข้อมูลใหม่เล็กน้อยให้ระบบจัดการเสร็จ
		}

		// ฟังก์ชันลบบัญชี
		function deleteAdmin(adminName) {
			if(confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบบัญชีผู้ใช้งาน: ${adminName} ?`)) {
				showLoading(true, &quot;กำลังลบผู้ใช้งาน...&quot;);
				fetch(WEB_APP_URL, {
					method: &#39;POST&#39;,
					body: JSON.stringify({ action: &#39;delete_admin&#39;, adminName: adminName, token: sessionStorage.getItem(&#39;token&#39;) })
				})
				.then(res =&gt; res.json())
				.then(result =&gt; {
					showLoading(false);
					if(result.status === &#39;success&#39;) {
						showToast(&#39;ลบผู้ใช้งานสำเร็จ&#39;, &#39;success&#39;);
						fetchAdminList(); // รีเฟรชตาราง
					} else {
						showCustomAlert(&quot;ข้อผิดพลาด&quot;, result.message);
					}
				}).catch(err =&gt; {
					showLoading(false);
					showToast(&#39;ลบผู้ใช้งานล้มเหลว&#39;, &#39;error&#39;);
				});
			}
		}

    <script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzZRAl1MQZjq7oTeaHJjTIxOF7ThlP0BWHeBNIyGqvAtsIaeBVp6206es9EspSxL4dHsg/exec';

// --- ระบบแจ้งเตือน Custom Alert ---
let customAlertCallback = null;

function showCustomAlert(title, message, callback = null) {
    customAlertCallback = callback; 
    document.getElementById('customAlertTitle').textContent = title;
    document.getElementById('customAlertMessage').textContent = message;
    const modal = document.getElementById('customAlertModal');
    const content = document.getElementById('customAlertContent');
    
    modal.classList.remove('hidden');
    setTimeout(() => {
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
    }, 10);
}

function closeCustomAlert() {
    const modal = document.getElementById('customAlertModal');
    const content = document.getElementById('customAlertContent');
    
    content.classList.remove('scale-100', 'opacity-100');
    content.classList.add('scale-95', 'opacity-0');
    
    setTimeout(() => { 
        modal.classList.add('hidden'); 
        if (typeof customAlertCallback === 'function') {
            customAlertCallback();
            customAlertCallback = null;
        }
    }, 300);
}

   }

// ฟังก์ชันดึงข้อมูลจาก Google Sheets
async function fetchStudentsData() {
	showLoading(true, &quot;กำลังดึงข้อมูลนักเรียน...&quot;); // 🟢 1. สั่งเปิดโหลด
    try {
        // แสดงสถานะกำลังโหลดบนตาราง
        document.getElementById('studentTableBody').innerHTML = `
            <tr>
                <td colspan=&quot;10&quot; class=&quot;py-10 text-center text-blue-600 font-bold text-lg&quot;>
                    <i class=&quot;fa-solid fa-circle-notch fa-spin mr-2&quot;></i>กำลังโหลดข้อมูลนักเรียน...
                </td>
            </tr>`;

        // ดึงข้อมูลผ่าน Web App
        const response = await fetch(WEB_APP_URL);
        const result = await response.json();
        
        // ตรวจสอบว่ามีข้อมูลกลับมาหรือไม่ (สมมติว่า Google Apps Script คืนค่าเป็น Array of Objects)
        const dataRows = result.data || result; 

        // Map คอลัมน์จาก Sheet สู่ตัวแปรที่ HTML ใช้
		allStudents = dataRows.map((row, index) => ({
            id: row['UID'] || index,
            img: row['รูป'] || 'https://via.placeholder.com/150',
            code: row['เลขประจำตัว'] ? row['เลขประจำตัว'].toString() : '',
            idCard: row['เลขบัตรประชาชน'] ? row['เลขบัตรประชาชน'].toString() : '',
            name: row['ชื่อ สกุล'] || '',
            room: row['ชั้น'] || '',
            no: row['เลขที่'] ? row['เลขที่'].toString() : '',
            gender: row['เพศ'] || '',
            year: row['ปีที่เข้าศึกษา'] ? row['ปีที่เข้าศึกษา'].toString() : '',
			sheetName: row['sheetName'] || '', // <-- เพิ่มบรรทัดนี้
            status: row['สถานะนักเรียน'] || 'กำลังศึกษา',
            statusDate: row['Date Note'] || ''
        }));

		// 🟢 ดึงปีการศึกษาที่มีทั้งหมดจาก sheetName และเรียงจากล่าสุดไปเก่าสุด
        const uniqueYears = [...new Set(allStudents.map(s => s.sheetName.replace('ปี ', '')))].filter(y => y.trim() !== '').sort((a, b) => b - a);
        availableYears = uniqueYears.length > 0 ? uniqueYears : ['2569'];

        // วาดปุ่ม Tab อัตโนมัติ
        renderYearTabs();

        // 🟢 เปลี่ยนค่าเริ่มต้นให้แสดงรายชื่อของปี &quot;ล่าสุด&quot; อัตโนมัติ
        filteredData = allStudents.filter(s => s.sheetName === ('ปี ' + availableYears[0]));
        
        // อัปเดต UI เมื่อได้ข้อมูลครบแล้ว
        renderTable();
        renderPagination();
        switchYearTab('overall'); 
        
		// 🟢 เพิ่มบรรทัดนี้ลงไปเพื่อให้แสดงสรุปตอนเปิดหน้าเว็บครั้งแรก 🟢
        updateStudentSummary();
		
        showToast('โหลดข้อมูลสำเร็จ', 'success');
		showLoading(false); // 🟢 2. ปิดโหลดเมื่อสำเร็จ

    } catch (error) {
        console.error(&quot;Error fetching data:&quot;, error);
        document.getElementById('studentTableBody').innerHTML = `
            <tr>
                <td colspan=&quot;10&quot; class=&quot;py-10 text-center text-red-500 font-bold text-lg&quot;>
                    <i class=&quot;fa-solid fa-triangle-exclamation mr-2&quot;></i>ไม่สามารถเชื่อมต่อฐานข้อมูลได้
                </td>
            </tr>`;
        showToast('เกิดข้อผิดพลาดในการดึงข้อมูล', 'error');
		showLoading(false); // 🟢 3. ปิดโหลดเมื่อเกิดข้อผิดพลาด
    }
}

        function getStatusBadge(status) {
            if (status === 'กำลังศึกษา') return '<span class=&quot;bg-[#83ebbc] text-[#0f5132] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>กำลังศึกษา</span>';
            if (status === 'ลาออก') return '<span class=&quot;bg-[#f8d7da] text-[#842029] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>ลาออก</span>';
			if (status === 'พักการเรียน') return '<span class=&quot;bg-#fabdb4] text-[#842029] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>พักการเรียน</span>';
            if (status === 'ย้ายสถานศึกษา') return '<span class=&quot;bg-[#fff3cd] text-[#664d03] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>ย้ายสถานศึกษา</span>';
            if (status === 'ขาดเรียนนาน') return '<span class=&quot;bg-[#ffe5d0] text-[#c2410c] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>ขาดเรียนนาน</span>';
            if (status === 'สำเร็จการศึกษา') return '<span class=&quot;bg-[#e7fc7e] text-[#4338ca] px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>สำเร็จการศึกษา</span>';
            return `<span class=&quot;bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-[13px] font-medium inline-block w-28 text-center&quot;>${status}</span>`;
        }

						 class=&quot;w-11 h-11 rounded-full mx-auto object-cover border-2 border-red-500 cursor-pointer transform hover:scale-110 hover:shadow-md hover:border-red-600 transition-all duration-300&quot;
						 onclick=&quot;openImageModal('${student.code}')&quot;

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            const container = document.getElementById('paginationControls');
            const info = document.getElementById('paginationInfo');
            
            const startIdx = filteredData.length === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const endIdx = Math.min(currentPage * rowsPerPage, filteredData.length);
            info.innerText = `แสดง ${startIdx}-${endIdx} จาก ${filteredData.length}`;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <button onclick=&quot;changePage(${currentPage - 1})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition flex items-center gap-1.5 font-medium bg-white disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed&quot; ${currentPage === 1 ? 'disabled' : ''}>
                    <i class=&quot;fa-solid fa-chevron-left text-[10px]&quot;></i> ก่อนหน้า
                </button>
            `;

            let startPage = Math.max(1, currentPage - 1);
            let endPage = Math.min(totalPages, currentPage + 1);

            if (startPage > 1) {
                html += `<button onclick=&quot;changePage(1)&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;>1</button>`;
                if (startPage > 2) html += `<span class=&quot;px-1 text-gray-400&quot;>...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `<button class=&quot;px-3 py-1.5 bg-[#0d6efd] border border-[#0d6efd] text-white rounded font-medium shadow-sm&quot;>${i}</button>`;
                } else {
                    html += `<button onclick=&quot;changePage(${i})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;>${i}</button>`;
                }
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class=&quot;px-1 text-gray-400&quot;>...</span>`;
                html += `<button onclick=&quot;changePage(${totalPages})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition font-medium bg-white&quot;>${totalPages}</button>`;
            }

            html += `
                <button onclick=&quot;changePage(${currentPage + 1})&quot; class=&quot;px-3 py-1.5 border border-gray-300 rounded text-gray-700 hover:bg-gray-100 transition flex items-center gap-1.5 font-medium bg-white disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed&quot; ${currentPage === totalPages ? 'disabled' : ''}>
                    ถัดไป <i class=&quot;fa-solid fa-chevron-right text-[10px]&quot;></i>
                </button>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }

        // --- ระบบ Filter ---
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const roomFilter = document.getElementById('roomFilter').value;
            const genderFilter = document.getElementById('genderFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

			filteredData = allStudents.filter(student => {
                const matchSearch = student.name.toLowerCase().includes(searchTerm) || student.code.includes(searchTerm);
                const matchStatus = statusFilter === &quot;&quot; || student.status === statusFilter;
				const matchRoom = roomFilter === &quot;&quot; || (roomFilter.includes('/') ? student.room === roomFilter : student.room.includes(roomFilter));
                const matchGender = genderFilter === &quot;&quot; || student.gender === genderFilter;
                const matchYear = yearFilter === &quot;&quot; || student.year === yearFilter;
                
                // 🟢 เพิ่มเงื่อนไขให้กรองเฉพาะข้อมูลที่มาจากชีต ปี 2569 เท่านั้น
                const matchSheet = student.sheetName === 'ปี 2569';
                
                return matchSearch &amp;&amp; matchStatus &amp;&amp; matchRoom &amp;&amp; matchGender &amp;&amp; matchYear &amp;&amp; matchSheet;
            });

            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage > totalPages &amp;&amp; totalPages > 0) {
                currentPage = totalPages;
            } else if (totalPages === 0) {
                currentPage = 1;
            }

            renderTable();
            renderPagination();
			// 🟢 เพิ่มบรรทัดนี้ลงไป 🟢
            updateStudentSummary();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('roomFilter').value = '';
            document.getElementById('genderFilter').value = '';
            document.getElementById('yearFilter').value = '';
            applyFilters();
            showToast('รีเซตตัวกรองเรียบร้อย', 'info');
        }

        // --- ระบบ Copy และ Excel ---
        function copyTableData() {
            let text = &quot;รหัส\tเลขบัตรประชาชน\tชื่อ-นามสกุล\tเพศ\tห้อง\tเลขที่\tปีที่เข้าศึกษา\tสถานะ\n&quot;;
            filteredData.forEach(student => {
                text += `${student.code}\t${student.idCard}\t${student.name}\t${student.gender}\t${student.room}\t${student.no}\t${student.year}\t${student.status}\n`;
            });

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('คัดลอกข้อมูลลง Clipboard แล้ว', 'success');
            } catch (err) {
                showToast('ไม่สามารถคัดลอกข้อมูลได้', 'error');
            }
            document.body.removeChild(textarea);
        }

        function exportToExcel() {
            let csv = &quot;\uFEFFรหัส,เลขบัตรประชาชน,ชื่อ-นามสกุล,เพศ,ห้อง,เลขที่,ปีที่เข้า,สถานะ\n&quot;;

            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement(&quot;a&quot;);
            link.setAttribute(&quot;href&quot;, url);
            link.setAttribute(&quot;download&quot;, &quot;student_data.csv&quot;);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('ส่งออกเป็นไฟล์ Excel เรียบร้อย', 'success');

        function openEditModal(code) {

function processExcelFile() {
            const year = document.getElementById('importYearInput').value.trim();
            const fileInput = document.getElementById('realImportFile');
            const file = fileInput.files[0];

            if (!year) {
                showToast('กรุณากำหนดปีการศึกษา', 'error');
                return;
            }
            if (!file) {
                showToast('กรุณาอัปโหลดไฟล์ Excel หรือ CSV', 'error');
                return;
            }

            // 🟢 สั่งแสดง Loading ทันทีที่เริ่มอ่านไฟล์
            showLoading(true, &quot;กำลังประมวลผลและตรวจสอบไฟล์...&quot;);

            // อ่านไฟล์ Excel ด้วย SheetJS
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // แปลงข้อมูลเป็น JSON (ข้ามแถวแรกที่เป็น Header)
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (json.length === 0) {
                        showLoading(false); // 🟢 ปิด Loading กรณีข้อมูลว่างเปล่า
                        showToast('ไม่พบข้อมูลนักเรียนในไฟล์', 'error');
                        return;
                    }

                    pendingImportData = json;
                    pendingImportYear = year;
                    
                    showLoading(false); // 🟢 ปิด Loading เมื่อตรวจสอบไฟล์สำเร็จพร้อมแสดงหน้าต่างยืนยัน

                    // ปิด Modal แรก และเปิด Modal ยืนยัน
                    closeImportModal();
                    openConfirmImportModal(json.length, year);

                } catch (error) {
                    showLoading(false); // 🟢 ปิด Loading เมื่อเกิดข้อผิดพลาด
                    showToast('เกิดข้อผิดพลาดในการอ่านไฟล์', 'error');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- ระบบแจ้งเตือน (Toast) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass, iconClass;
            switch(type) {
                case 'success': bgClass = 'bg-[#198754] text-white'; iconClass = 'fa-solid fa-circle-check'; break;
                case 'error': bgClass = 'bg-[#dc3545] text-white'; iconClass = 'fa-solid fa-triangle-exclamation'; break;
                default: bgClass = 'bg-[#0d6efd] text-white'; iconClass = 'fa-solid fa-circle-info';
            }

            toast.className = `${bgClass} px-5 py-3 rounded-md shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 flex items-center gap-3 font-medium text-sm pointer-events-auto`;
            toast.innerHTML = `<i class=&quot;${iconClass} text-lg&quot;></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

                    let total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                    if(total === 0) return '';
                    let percentage = Math.round((value / total) * 100) + '%';
                    return `${value} คน\n(${percentage})`;
                }
            }
        }
    }
});
