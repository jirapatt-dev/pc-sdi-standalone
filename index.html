// --- ฟังก์ชันที่ 1: ตารางรายปี (แยกตามห้องเรียน แบบดั้งเดิม) ---
function renderDynamicTable(studentsInYear) {
    let counts = { 1: Array(15).fill(0), 2: Array(15).fill(0), 3: Array(15).fill(0), 4: Array(15).fill(0), 5: Array(15).fill(0), 6: Array(15).fill(0) };
    studentsInYear.forEach(s => {
        let match = s.room.match(/ม\.(\d)\/(\d+)/);
        if (match) {
            let level = parseInt(match[1]);
            let room = parseInt(match[2]);
            if (level >= 1 &amp;&amp; level <= 6 &amp;&amp; room >= 1 &amp;&amp; room <= 14) counts[level][room]++;
        }
    });

    function getRowHtml(label, levels, trClass, tdPy, labelClass, totalClass) {
        let totalAll = 0, roomTotals = Array(15).fill(0);
        levels.forEach(l => { for(let r = 1; r <= 14; r++) { roomTotals[r] += counts[l][r]; totalAll += counts[l][r]; } });
        let html = `<tr class=&quot;${trClass}&quot;><td class=&quot;${tdPy} px-2 ${labelClass}&quot;>${label}</td><td class=&quot;${tdPy} px-2 ${totalClass}&quot;>${totalAll > 0 ? totalAll : '-'}</td>`;
        for(let r = 1; r <= 14; r++) html += `<td class=&quot;${tdPy} px-2&quot;>${roomTotals[r] > 0 ? roomTotals[r] : '-'}</td>`;
        return html + `</tr>`;
    }

    let tbodyHtml = '';
    tbodyHtml += getRowHtml('ม.1', [1], 'bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors', 'py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('ม.2', [2], 'bg-[#ffffb3] text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors', 'py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('ม.3', [3], 'bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors', 'py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('รวม ม.1-3', [1,2,3], 'bg-[#9af166] text-[#000000] font-bold border-b border-gray-300 hover:bg-orange-300 transition-colors', 'py-3', 'font-bold');
    tbodyHtml += getRowHtml('ม.4', [4], 'bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors', 'py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('ม.5', [5], 'bg-[#ffffb3] text-[#000000] hover:bg-orange-300 transition-colors','py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('ม.6', [6], 'bg-white text-[#000000] hover:bg-orange-300 border-b border-gray-200 transition-colors', 'py-2.5', 'font-bold', 'font-bold text-blue-600');
    tbodyHtml += getRowHtml('รวม ม.4-6', [4,5,6], 'bg-[#9af166] text-[#000000] font-bold border-b border-gray-300 hover:bg-orange-300 transition-colors', 'py-3', 'font-bold');
    tbodyHtml += getRowHtml('รวม ม.1-6', [1,2,3,4,5,6], 'bg-yellow-300 text-[#000000] font-bold text-[15px]', 'py-3.5', '', 'text-lg');

    document.getElementById('dynamicTableBody').innerHTML = tbodyHtml;
}

// --- ฟังก์ชันที่ 2: ตารางสถิติโดยรวม (แยกตามปีการศึกษาและเพศ) ---
function renderOverallTable() {
    // 🟢 เรียงปีจากน้อยไปมากสำหรับแสดงในตารางให้ดูง่าย
    const years = availableYears.slice().sort((a, b) => a - b);
    const activeStatuses = ['กำลังศึกษา', 'พักการเรียน', 'ขาดเรียนนาน', 'สำเร็จการศึกษา'];
    let tbodyHtml = '';
    
    // 🟢 เพิ่มตัวแปรเก็บยอดรวมทั้งหมด (Grand Total) แยกชาย-หญิง
    let grandTotal = 0;
    let grandMaleTotal = 0;
    let grandFemaleTotal = 0;
    let colTotals = { 1: { m:0, f:0, t:0 }, 2: { m:0, f:0, t:0 }, 3: { m:0, f:0, t:0 }, 4: { m:0, f:0, t:0 }, 5: { m:0, f:0, t:0 }, 6: { m:0, f:0, t:0 } };

    years.forEach(year => {
        let studentsInYear = allStudents.filter(s => s.sheetName === ('ปี ' + year) &amp;&amp; activeStatuses.includes(s.status));
        let levelData = { 1: { m:0, f:0 }, 2: { m:0, f:0 }, 3: { m:0, f:0 }, 4: { m:0, f:0 }, 5: { m:0, f:0 }, 6: { m:0, f:0 } };

        studentsInYear.forEach(s => {
            let match = s.room.match(/ม\.(\d)/); 
            if (match) {
                let level = parseInt(match[1]);
                if (level >= 1 &amp;&amp; level <= 6) {
                    if (s.gender === 'ชาย') levelData[level].m++;
                    if (s.gender === 'หญิง') levelData[level].f++;
                }
            }
        });

        tbodyHtml += `<tr class=&quot;hover:bg-gray-50 transition-colors border-b border-gray-200&quot;>`;
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center text-gray-800&quot;>${year}</td>`;
        
        let rowHtml = '';
        
        // 🟢 เพิ่มตัวแปรเก็บยอดรวมเฉพาะปี แยกชาย-หญิง
        let yearTotal = 0;
        let yearMaleTotal = 0;
        let yearFemaleTotal = 0;

        for (let i = 1; i <= 6; i++) {
            let m = levelData[i].m; let f = levelData[i].f; let t = m + f;
            
            // สะสมยอดรวมของปีนั้น
            yearMaleTotal += m;
            yearFemaleTotal += f;
            yearTotal += t; 
            
            colTotals[i].m += m; colTotals[i].f += f; colTotals[i].t += t;
            rowHtml += `<td class=&quot;py-2 px-2 text-center&quot;>${m > 0 ? m : ''}</td><td class=&quot;py-2 px-2 text-center&quot;>${f > 0 ? f : ''}</td><td class=&quot;py-2 px-2 text-center font-bold bg-gray-50/50&quot;>${t > 0 ? t : ''}</td>`;
        }
        
        // สะสมยอดรวมทั้งหมด (Grand Total) ของทุกปี
        grandMaleTotal += yearMaleTotal;
        grandFemaleTotal += yearFemaleTotal;
        grandTotal += yearTotal;

        // ใส่ยอดรวมด้านซ้ายสุด
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center font-bold text-blue-600&quot;>${yearTotal > 0 ? yearTotal : ''}</td>`;
        // ใส่ข้อมูล ม.1-6 ตรงกลาง
        tbodyHtml += rowHtml;
        
        // 🟢 ใส่ช่องสรุป &quot;รวม ม.1-6&quot; ท้ายสุด แยกชาย-หญิง
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center font-bold text-blue-800 bg-blue-50&quot;>${yearMaleTotal > 0 ? yearMaleTotal : ''}</td>`;
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center font-bold text-blue-800 bg-blue-50&quot;>${yearFemaleTotal > 0 ? yearFemaleTotal : ''}</td>`;
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center font-bold text-blue-900 bg-blue-100&quot;>${yearTotal > 0 ? yearTotal : ''}</td>`;
        
        tbodyHtml += `</tr>`;
    });

    // 🟢 สร้างแถว &quot;รวม&quot; ด้านล่างสุด (สีเหลือง)
    tbodyHtml += `<tr class=&quot;bg-[#fcd34d] font-bold border-b border-black&quot;>`;
    tbodyHtml += `<td class=&quot;py-3 px-2 text-center text-black&quot;>รวม</td><td class=&quot;py-3 px-2 text-center text-black bg-[#fbbf24] text-lg&quot;>${grandTotal > 0 ? grandTotal : ''}</td>`;
    
    for (let i = 1; i <= 6; i++) {
        tbodyHtml += `<td class=&quot;py-2 px-2 text-center text-black&quot;>${colTotals[i].m > 0 ? colTotals[i].m : ''}</td><td class=&quot;py-2 px-2 text-center text-black&quot;>${colTotals[i].f > 0 ? colTotals[i].f : ''}</td><td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;>${colTotals[i].t > 0 ? colTotals[i].t : ''}</td>`;
    }
    
    // 🟢 ใส่ช่องสรุป &quot;รวม ม.1-6&quot; ของแถวท้ายสุด (สีเหลืองเข้ม)
    tbodyHtml += `<td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;>${grandMaleTotal > 0 ? grandMaleTotal : ''}</td>`;
    tbodyHtml += `<td class=&quot;py-2 px-2 text-center text-black bg-[#fbbf24]&quot;>${grandFemaleTotal > 0 ? grandFemaleTotal : ''}</td>`;
    tbodyHtml += `<td class=&quot;py-2 px-2 text-center text-black bg-[#f59e0b] text-lg&quot;>${grandTotal > 0 ? grandTotal : ''}</td>`;
    
    tbodyHtml += `</tr>`;

    document.getElementById('overallTableBody').innerHTML = tbodyHtml;
}



		
function switchYearTab(selectedYear) {
    const tabs = ['overall', ...availableYears]; 
    
    tabs.forEach(tabId => {
        const tab = document.getElementById(tabId === 'overall' ? 'tabOverall' : 'tabYear' + tabId);
        if (!tab) return;
        
        if (tabId === selectedYear) {
            tab.classList.add('text-[#0d6efd]', 'border-[#0d6efd]');
            tab.classList.remove('text-gray-500', 'border-transparent');
        } else {
            tab.classList.add('text-gray-500', 'border-transparent');
            tab.classList.remove('text-[#0d6efd]', 'border-[#0d6efd]');
        }
    });

    const activeStatuses = ['กำลังศึกษา', 'พักการเรียน', 'ขาดเรียนนาน', 'สำเร็จการศึกษา'];
    let studentsToShow = [];

    if (selectedYear === 'overall') {
        studentsToShow = allStudents.filter(s => activeStatuses.includes(s.status)); 
        document.getElementById('trendChartContainer').classList.remove('hidden'); 
        
        // 🟢 ดึงปีที่มีเรียงจากเก่าไปใหม่
        const years = availableYears.slice().sort((a, b) => a - b);
        let tData = [], mData = [], fData = [];
        
        years.forEach(yr => {
            let sInYr = allStudents.filter(s => s.sheetName === ('ปี ' + yr) &amp;&amp; activeStatuses.includes(s.status));
            tData.push(sInYr.length);
            mData.push(sInYr.filter(s => s.gender === 'ชาย').length);
            fData.push(sInYr.filter(s => s.gender === 'หญิง').length);
        });

        // อัปเดตกราฟแนวโน้ม (Trend)
        myTrendChart.data.labels = years.map(y => 'ปี ' + y);
        myTrendChart.data.datasets[0].data = tData;
        myTrendChart.data.datasets[1].data = mData;
        myTrendChart.data.datasets[2].data = fData;
        myTrendChart.update();
        document.getElementById('trendChartTitle').innerHTML = '<i class=&quot;fa-solid fa-chart-line text-2xl&quot;></i> แนวโน้มจำนวนนักเรียน ชาย หญิง รวม แต่ละปี';

        // อัปเดตกราฟวงกลม (Pie) แบบ Dynamic
        myPieChart.data.labels = years.map(y => 'ปี ' + y);
        const palette = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316'];
        myPieChart.data.datasets[0].backgroundColor = years.map((_, i) => palette[i % palette.length]);
        myPieChart.data.datasets[0].data = tData;
        myPieChart.update();
        document.getElementById('pieChartTitle').innerHTML = '<i class=&quot;fas fa-chart-pie text-2xl&quot;></i> สัดส่วนนักเรียนแยกตามปีการศึกษา';
        
        let pieLegendHtml = '';
        years.forEach((yr, i) => {
            pieLegendHtml += `<div class=&quot;flex items-center gap-2&quot;><span class=&quot;w-6 h-3 rounded-sm&quot; style=&quot;background-color: ${palette[i % palette.length]}&quot;></span> ${yr}</div>`;
        });
        document.getElementById('pieLegend').innerHTML = pieLegendHtml;

            { label: 'ชาย', data: mData, backgroundColor: '#3b82f6', borderRadius: 4 },

        renderOverallTable();

		// --- ฟังก์ชันควบคุม Loading Overlay ---
		let loadingInterval; 
		function showLoading(show, text = &quot;กำลังโหลดข้อมูล...&quot;) {
			const overlay = document.getElementById('loading-overlay');
			const bar = document.getElementById('loading-progress-bar');
			const msg = document.getElementById('loading-text-msg');

			if (show) {
				if (msg) msg.innerText = text;
				if (overlay) overlay.style.display = 'flex';
				
				let width = 0;
				if (bar) { bar.style.width = '0%'; bar.innerText = '0%'; }
				if (loadingInterval) clearInterval(loadingInterval);
				
				loadingInterval = setInterval(() => {
					if (width < 90) width += Math.random() * 5;
					else if (width < 98) width += 0.2;
					if (bar) { bar.style.width = width + '%'; bar.innerText = Math.round(width) + '%'; }
				}, 200);
			} else {
				if (loadingInterval) clearInterval(loadingInterval);
				if (bar) { bar.style.width = '100%'; bar.innerText = '100%'; }
				setTimeout(() => { if (overlay) overlay.style.display = 'none'; }, 500);
			}
		}
		
		let currentUserRole = '';

		// 1. ฟังก์ชัน Login
		async function submitAdminLogin() {
			const user = document.getElementById('adminUsername').value.trim();
			const pass = document.getElementById('adminPassword').value.trim();
			const captchaInput = document.getElementById('captchaAnswer').value.trim();
			const ans = parseInt(captchaInput, 10);
			
			if(!user || !pass) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วน&quot;); 
				return;
			}

			if (captchaInput === '') {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณากรอกคำตอบ Captcha&quot;);
				return;
			}
			if (ans !== captchaCorrectAnswer) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;ผลลัพธ์ Captcha ไม่ถูกต้อง กรุณาลองใหม่&quot;);
				generateCaptcha(); 
				return;
			}
			
			showLoading(true, &quot;กำลังเข้าสู่ระบบ...&quot;); 
			
			try {
				const response = await fetch(WEB_APP_URL, {
					method: 'POST',
					body: JSON.stringify({ action: 'login', username: user, password: pass, token: sessionStorage.getItem('token') }) 
				});
				const result = await response.json();
				
				if (result.status === 'success') {
					// บันทึกสถานะ Session
					sessionStorage.setItem('isLoggedIn', 'true');
					sessionStorage.setItem('role', result.data.role);
					sessionStorage.setItem('name', result.data.name);
					sessionStorage.setItem('token', result.data.token); // 👈 เพิ่มบรรทัดนี้
					
					// ระบบจำการเข้าสู่ระบบ (Remember Me) ลง LocalStorage
					const isRemember = document.getElementById('rememberMe').checked;
					if (isRemember) {
						localStorage.setItem('savedUser', user);
						localStorage.setItem('savedPass', pass);
						localStorage.setItem('isRememberMe', 'true');
					} else {
						localStorage.removeItem('savedUser');
						localStorage.removeItem('savedPass');
						localStorage.setItem('isRememberMe', 'false');
					}
					
					currentUserRole = result.data.role;
					currentUserName = result.data.name;
					
					// อัปเดต UI ส่วนหัว
					document.getElementById('topAdminName').textContent = currentUserName; 
					document.getElementById('marqueeAdminName').textContent = currentUserName;
					document.getElementById('userStatusBar').classList.remove('hidden');
					document.getElementById('userStatusBar').classList.add('flex');
					
					// ปิดหน้าต่าง Login
					document.getElementById('adminLoginModal').classList.add('hidden');
					document.getElementById('adminLoginModal').classList.remove('flex');
					
					applyRolePermissions();

					// แสดง Modal ถามว่าจะไปหน้าไหน
					showLoading(false);
					document.getElementById('downloadPromptModal').classList.remove('hidden');
					document.getElementById('downloadPromptModal').classList.add('flex');

				} else {
					showLoading(false);
					showCustomAlert(&quot;เข้าสู่ระบบล้มเหลว&quot;, result.message);
					generateCaptcha(); 
				}
			} catch (e) {
				showLoading(false);
				showCustomAlert(&quot;ข้อผิดพลาด&quot;, &quot;เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว&quot;);
			}
		}

		function togglePasswordVisibility(inputId, iconId) {
			const input = document.getElementById(inputId);
			const icon = document.getElementById(iconId);
			if (input.type === 'password') {
				input.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				input.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}

		// 1. เช็คอีเมลว่ามีในระบบไหมเมื่อกรอกเสร็จ (onblur)
		async function verifyEmailExists() {
			const email = document.getElementById('resetEmail').value.trim();
			const statusMsg = document.getElementById('emailStatusMsg');
			const btnRequest = document.getElementById('btnRequestOTP');
			
			if (!email) {
				statusMsg.classList.add('hidden');
				btnRequest.disabled = true;
				return;
			}

			statusMsg.classList.remove('hidden');
			statusMsg.className = &quot;text-xs mt-1 text-left font-bold text-blue-500&quot;;
			statusMsg.textContent = &quot;กำลังตรวจสอบอีเมล...&quot;;
			btnRequest.disabled = true;

			try {
				const response = await fetch(WEB_APP_URL, {
					method: 'POST', mode: 'cors',
					body: JSON.stringify({ action: 'check_admin_email', email: email, token: sessionStorage.getItem('token') })
				});
				const result = await response.json();

				if (result.status === 'success' &amp;&amp; result.exists) {
					statusMsg.className = &quot;text-xs mt-1 text-left font-bold text-green-600&quot;;
					// แสดงข้อความทักทายพร้อมชื่อที่ได้จากฝั่งเซิร์ฟเวอร์
					statusMsg.textContent = &quot;✓ สวัสดีคุณ &quot; + result.adminName; 
					btnRequest.disabled = false;
				} else {
					statusMsg.className = &quot;text-xs mt-1 text-left font-bold text-red-500&quot;;
					statusMsg.textContent = &quot;✗ ไม่พบอีเมลนี้ในระบบ&quot;;
				}
			} catch (e) {
				statusMsg.className = &quot;text-xs mt-1 text-left font-bold text-red-500&quot;;
				statusMsg.textContent = &quot;ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้&quot;;
			}
		}

		// 2. ขอรับ OTP
		async function requestOTP() {
			const email = document.getElementById('resetEmail').value.trim();
			const newPassword = document.getElementById('resetNewPassword').value;

			if (!newPassword || newPassword.length > 10) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณาตั้งรหัสผ่านใหม่ (สูงสุด 10 หลัก)&quot;);
				return;
			}

            // 🟢 เปลี่ยนวิธีเรียกใช้ showLoading
			showLoading(true, &quot;กรุณารอสักครู่ ระบบกำลังส่งรหัสไปยังอีเมลของคุณ&quot;);
			
			try {
				const response = await fetch(WEB_APP_URL, {
					method: 'POST', mode: 'cors',
					body: JSON.stringify({ action: 'request_otp', email: email, newPassword: newPassword, token: sessionStorage.getItem('token') })
				});
				const result = await response.json();
                
                // 🟢 เปลี่ยนจาก hideLoading() เป็น showLoading(false)
				showLoading(false); 

				if (result.status === 'success') {
					document.getElementById('forgotPasswordModal').classList.add('hidden');
					document.getElementById('otpVerifyModal').classList.remove('hidden');
					document.getElementById('otpVerifyModal').classList.add('flex');
					document.getElementById('otpInput').value = '';
					startOTPTimer();
				} else {
					showCustomAlert(&quot;ข้อผิดพลาด&quot;, result.message);
				}
			} catch (e) {
                // 🟢 เปลี่ยนจาก hideLoading() เป็น showLoading(false)
				showLoading(false);
				showCustomAlert(&quot;ข้อผิดพลาด&quot;, &quot;เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว&quot;);
			}
		}

		// 3. เริ่มนับถอยหลัง 3 นาที
		function startOTPTimer() {
			clearInterval(otpTimerInterval);
			otpTimeLeft = 180;
			updateTimerDisplay();

			otpTimerInterval = setInterval(() => {
				otpTimeLeft--;
				updateTimerDisplay();
				if (otpTimeLeft <= 0) {
					clearInterval(otpTimerInterval);
					document.getElementById('otpTimerDisplay').textContent = &quot;หมดเวลา&quot;;
					// บังคับให้เริ่มขอใหม่
					showCustomAlert(&quot;หมดเวลา&quot;, &quot;รหัส OTP หมดอายุ กรุณาขอรับรหัสใหม่&quot;, cancelOTP);
				}
			}, 1000);
		}

		function updateTimerDisplay() {
			const m = Math.floor(otpTimeLeft / 60).toString().padStart(2, '0');
			const s = (otpTimeLeft % 60).toString().padStart(2, '0');
			document.getElementById('otpTimerDisplay').textContent = `${m}:${s}`;
		}

		function cancelOTP() {
			clearInterval(otpTimerInterval);
			document.getElementById('otpVerifyModal').classList.add('hidden');
			document.getElementById('forgotPasswordModal').classList.remove('hidden');
		}

		// 4. ส่งยืนยัน OTP (เปลี่ยนรหัสผ่าน)
		async function submitOTP() {
			const otp = document.getElementById('otpInput').value.trim();
			const email = document.getElementById('resetEmail').value.trim();
            // 🟢 ดึงรหัสผ่านใหม่ เพื่อส่งไปบันทึก
            const newPassword = document.getElementById('resetNewPassword').value;

			if (otp.length !== 6) {
				showCustomAlert(&quot;แจ้งเตือน&quot;, &quot;กรุณากรอกรหัส OTP ให้ครบ 6 หลัก&quot;);
				return;
			}

			showLoading(true, &quot;กำลังตรวจสอบรหัส OTP และเปลี่ยนรหัสผ่าน&quot;);
			
			try {
				const response = await fetch(WEB_APP_URL, {
					method: 'POST', mode: 'cors',
                    // 🟢 แนบ newPassword เข้าไปใน payload ด้วย
					body: JSON.stringify({ action: 'verify_otp', email: email, otp: otp, newPassword: newPassword, token: sessionStorage.getItem('token') })
				});
				const result = await response.json();
                
				showLoading(false);

				if (result.status === 'success') {
					clearInterval(otpTimerInterval);
                    
                    // 🟢 เก็บข้อมูลสิทธิ์ User ไว้ชั่วคราว เพื่อเตรียมทำ Auto-Login
                    sessionStorage.setItem('tempAutoLoginRole', result.data.role);
                    sessionStorage.setItem('tempAutoLoginName', result.data.name);

					document.getElementById('otpVerifyModal').classList.add('hidden');
					document.getElementById('resetSuccessModal').classList.remove('hidden');
					document.getElementById('resetSuccessModal').classList.add('flex');
				} else {
					showCustomAlert(&quot;รหัสไม่ถูกต้อง&quot;, result.message);
				}
			} catch (e) {
				showLoading(false);
				showCustomAlert(&quot;ข้อผิดพลาด&quot;, &quot;เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว&quot;);
			}
		}

		// 3. ฟังก์ชันดึงข้อมูลไฟล์และเรนเดอร์ตาราง (เรียงปีล่าสุดขึ้นก่อน)
		async function fetchFileListData() {
			showLoading(true, &quot;กำลังดึงข้อมูลไฟล์...&quot;); 
			
			try {
				// ยิงคำสั่งไปที่ Google Apps Script
				const response = await fetch(WEB_APP_URL, {
					method: 'POST',
					body: JSON.stringify({ action: 'get_files', token: sessionStorage.getItem('token') })
				});
				const result = await response.json();
				
				if (result.status === 'success') {
					// แปลงข้อมูลที่ได้จาก Backend ให้อยู่ในรูปแบบที่ตารางต้องการ
					savedFilesList = result.data.map(item => {
						
						// แยกไฟล์ลิงก์ที่ถูกรวมไว้ด้วย \n ออกมา
						let linksStr = item.filesStr ? item.filesStr.toString().split('\n') : [];
						let filesArr = [];
						let externalLink = '';
						
						linksStr.forEach(l => {
							let link = l.trim();
							if(link !== '') {
								// ถ้าเป็นลิงก์ Drive ให้ถือว่าเป็นไฟล์แนบ ถ้าไม่ใช่ให้ถือว่าเป็นลิงก์ภายนอก
								if(link.includes('drive.google')) {
									filesArr.push({ name: 'ดาวน์โหลด', url: link });
								} else {
									externalLink = link;
								}
							}
						});

						return {
							id: item.id,
							year: item.year,
							date: item.date,
							recorder: item.recorder,
							link: externalLink,
							files: filesArr
						};
					});

					// เรียงข้อมูลตามปีจากมากไปน้อย
					savedFilesList.sort((a, b) => b.year - a.year);
					renderFileListTable();
				} else {
					showToast('ดึงข้อมูลไฟล์ล้มเหลว', 'error');
				}
			} catch (error) {
				console.error(&quot;Error fetching file list:&quot;, error);
				showToast('ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
			} finally {
				showLoading(false);
			}
		}

		function renderFileListTable() {
			const tbody = document.getElementById('fileListTableBody');
			tbody.innerHTML = ''; 
			const role = sessionStorage.getItem('role') || currentUserRole;
			const isPrivileged = (role === 'admin' || role === 'academic'); 

			if (savedFilesList.length === 0) {
				tbody.innerHTML = `<tr><td colspan=&quot;${isPrivileged ? 6 : 5}&quot; class=&quot;py-10 text-center text-gray-500&quot;><i class=&quot;fa-solid fa-folder-open text-2xl mb-2 block&quot;></i>ยังไม่มีข้อมูลไฟล์รายชื่อนักเรียน</td></tr>`;
				return;
			}

			savedFilesList.forEach((fileInfo, index) => {
				let fileLinksHtml = '';
				
				// แสดงลิงก์ไฟล์แนบ
				if (fileInfo.files &amp;&amp; fileInfo.files.length > 0) {
					fileInfo.files.forEach(f => {
						fileLinksHtml += `<a href=&quot;${f.url}&quot; target=&quot;_blank&quot; class=&quot;inline-flex items-center gap-1 bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold hover:bg-blue-200 mr-2 mb-1&quot;><i class=&quot;fa-solid fa-download&quot;></i> ${f.name}</a>`; 
					});
				}
				
				// แสดงลิงก์ภายนอก
				if (fileInfo.link) {
					fileLinksHtml += `<a href=&quot;${fileInfo.link}&quot; target=&quot;_blank&quot; class=&quot;inline-flex items-center gap-1 bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold hover:bg-green-200&quot;><i class=&quot;fa-solid fa-link&quot;></i> ลิงก์ภายนอก</a>`; 
				}

				// ส่วนปุ่มจัดการ (แก้ไข/ลบ)
				let manageHtml = '';
				if (isPrivileged) {
					manageHtml = `
					<td class=&quot;py-2 px-2 print:hidden&quot;>
						<div class=&quot;flex justify-center gap-2&quot;>
							<button onclick=&quot;openEditFileModal('${fileInfo.id}')&quot; class=&quot;bg-blue-500 hover:bg-blue-600 text-white w-8 h-8 rounded shadow-sm flex justify-center items-center&quot; title=&quot;แก้ไข/อัปโหลดทับ&quot;><i class=&quot;fa-solid fa-pen&quot;></i></button>
							<button onclick=&quot;openDeleteFileModal('${fileInfo.id}')&quot; class=&quot;bg-red-500 hover:bg-red-600 text-white w-8 h-8 rounded shadow-sm flex justify-center items-center&quot; title=&quot;ลบข้อมูล&quot;><i class=&quot;fa-solid fa-trash&quot;></i></button>
						</div>
					</td>`;
				}

				// จัดการรูปแบบวันที่เพื่อป้องกัน NaN/NaN/NaN
				let displayDate = fileInfo.date; 
				const dateObj = new Date(fileInfo.date);

				if (!isNaN(dateObj.getTime())) {
					const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
					displayDate = `${dateObj.getDate()} ${thaiMonths[dateObj.getMonth()]} ${dateObj.getFullYear() + 543}`; 
				}

				const tr = document.createElement('tr'); 
				tr.className = &quot;hover:bg-gray-50 transition-colors border-b border-gray-200&quot;; 
				tr.innerHTML = `
					<td class=&quot;py-3 px-2 text-gray-700&quot;>${index + 1}</td>
					<td class=&quot;py-3 px-2 font-bold text-black text-lg&quot;>${fileInfo.year}</td>
					<td class=&quot;py-3 px-2 text-gray-600&quot;>${displayDate}</td>
					<td class=&quot;py-3 px-2 text-gray-700&quot;>${fileInfo.recorder}</td>
					<td class=&quot;py-3 px-4 text-left whitespace-normal&quot;>${fileLinksHtml}</td>
					${manageHtml}
				`; 
				tbody.appendChild(tr); 
			});
		}

		async function submitUploadFile() {
			const id = document.getElementById('editFileId').value;
			const year = document.getElementById('uploadFileYear').value;
			const date = document.getElementById('uploadFileDate').value;
			const recorder = document.getElementById('uploadFileRecorder').value;
			const fileInput = document.getElementById('uploadFileInput');
			const link = document.getElementById('uploadFileLink').value;

			if (!year || !date || (fileInput.files.length === 0 &amp;&amp; !link)) {
				showToast('กรุณากรอกปี วันที่ และแนบไฟล์/ลิงก์ ให้ครบถ้วน', 'error');
				return;
			}

			showLoading(true, &quot;กำลังบันทึกข้อมูลและอัปโหลดไฟล์...&quot;);

			let filesArray = [];

			// 1. แปลงไฟล์ที่แนบให้เป็นรูปแบบ Base64
			if (fileInput.files.length > 0) {
				for (let i = 0; i < fileInput.files.length; i++) {
					let file = fileInput.files[i];
					let base64 = await new Promise((resolve) => {
						let reader = new FileReader();
						reader.onload = (e) => resolve(e.target.result);
						reader.readAsDataURL(file);
					});
					filesArray.push({
						name: file.name,
						mimeType: file.type,
						base64: base64
					});
				}
			}

			// 2. ส่งข้อมูลไปบันทึกลง Google Apps Script
			try {
				const response = await fetch(WEB_APP_URL, {
					method: 'POST',
					body: JSON.stringify({
						action: 'upload_file',
						id: id,
						year: year,
						date: date,
						recorder: recorder,
						link: link,
						files: filesArray,
						token: sessionStorage.getItem('token')
					})
				});

				const result = await response.json();

				if (result.status === 'success') {
					closeUploadFileModal();
					fetchFileListData(); // ดึงข้อมูลใหม่จากฐานข้อมูลมาแสดง
					showToast('บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
				} else {
					showToast('เกิดข้อผิดพลาด: ' + result.message, 'error');
				}
			} catch (error) {
				console.error(error);
				showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
			} finally {
				showLoading(false);
			}
		}

		// ฟังก์ชันสำหรับแปลงวันที่ใน Modal อัปโหลดไฟล์ให้เป็นภาษาไทย

        function executeGlobalSearch() {
            const keyword = document.getElementById('globalSearchInput').value.trim().toLowerCase();
            const resultContainer = document.getElementById('globalSearchResult');
            resultContainer.innerHTML = '';
            
            if (!keyword) {
                resultContainer.innerHTML = '<p class=&quot;text-red-500 text-sm text-center py-2&quot;>กรุณาระบุคำค้นหา</p>';
                resultContainer.classList.remove('hidden');
                resultContainer.classList.add('flex');
                return;
            }

            // ค้นหาในฐานข้อมูล allStudents ด้วย ชื่อ นามสกุล หรือรหัสนักเรียน
            const found = allStudents.filter(s => 
                s.name.toLowerCase().includes(keyword) || 
                s.code.includes(keyword)
            );

            if (found.length === 0) {
                resultContainer.innerHTML = '<p class=&quot;text-gray-500 text-sm text-center py-4&quot;>ไม่พบข้อมูลนักเรียนที่ค้นหา</p>';
            } else if (found.length === 1) {
                // ถ้าค้นเจอแค่ 1 คน เปิดรายละเอียดทันที
                closeGlobalSearchModal();
                showSearchDetailModal(found[0]);
                return; 
            } else {
                // ถ้าค้นเจอหลายคน สร้างลิสต์ให้ผู้ใช้คลิกเลือก
                found.forEach(s => {
                    const div = document.createElement('div');
                    div.className = &quot;flex items-center justify-between bg-gray-50 border border-gray-200 p-3 rounded-lg cursor-pointer hover:bg-purple-50 transition-colors&quot;;
                    div.onclick = () => {
                        closeGlobalSearchModal();
                        showSearchDetailModal(s);
                    };
                    div.innerHTML = `
                        <div class=&quot;flex items-center gap-3&quot;>
                            <img src=&quot;${s.img || 'https://via.placeholder.com/150'}&quot; class=&quot;w-10 h-10 rounded-full object-cover&quot;>
                            <div>
                                <p class=&quot;font-bold text-gray-800 text-sm&quot;>${s.name}</p>
                                <p class=&quot;text-xs text-gray-500&quot;>รหัส: ${s.code} | ห้อง: ${s.room}</p>
                            </div>
                        </div>
                        <i class=&quot;fa-solid fa-chevron-right text-purple-400&quot;></i>
                    `;
                    resultContainer.appendChild(div);
                });
            }
            resultContainer.classList.remove('hidden');
            resultContainer.classList.add('flex');
        }

        // --- ระบบแสดงผลลัพธ์พร้อมปิดบัง 4 ตัวท้าย (Masked ID Card) ---
        function showSearchDetailModal(student) {
            const modal = document.getElementById('searchDetailModal');
            const card = document.getElementById('searchDetailModalCard');
            
            document.getElementById('sdImage').src = student.img || 'https://via.placeholder.com/150';
            document.getElementById('sdName').innerText = student.name;
            document.getElementById('sdCodeText').innerText = `รหัส: ${student.code}`;
            
            // แปลงเลขบัตรประชาชนให้ 4 ตัวท้ายเป็น xxxx
            let maskedId = student.idCard;
            if (maskedId &amp;&amp; maskedId.length >= 4) {
                maskedId = maskedId.substring(0, maskedId.length - 4) + 'xxxx';
            } else {
                maskedId = 'ไม่มีข้อมูล';
            }
            document.getElementById('sdIdCardText').innerText = `เลขบัตรประชาชน: ${maskedId}`;
            
            let statusText = student.status;
            if(student.status !== 'กำลังศึกษา' &amp;&amp; student.statusDate) {
                const dateObj = new Date(student.statusDate);
                const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
                statusText += ` (${dateObj.getDate()} ${thaiMonths[dateObj.getMonth()]} ${dateObj.getFullYear() + 543})`;
            }

            document.getElementById('sdRoomText').innerText = `ห้อง ${student.room} | เลขที่ ${student.no} | สถานะ: `;
            
            const statusSpan = document.getElementById('sdStatusText');
            statusSpan.innerText = statusText;
            
            // ใช้ Badge สีเดียวกับตารางหลัก
            if (student.status === 'กำลังศึกษา') statusSpan.className = 'font-bold text-[#0f5132]';
            else if (student.status === 'พักการเรียน') statusSpan.className = 'font-bold text-[#842029]';
            else if (student.status === 'ลาออก') statusSpan.className = 'font-bold text-[#842029]';
            else if (student.status === 'ย้ายสถานศึกษา') statusSpan.className = 'font-bold text-[#664d03]';
            else if (student.status === 'ขาดเรียนนาน') statusSpan.className = 'font-bold text-[#c2410c]';
            else if (student.status === 'สำเร็จการศึกษา') statusSpan.className = 'font-bold text-[#4338ca]';
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeSearchDetailModal() {
            const modal = document.getElementById('searchDetailModal');
            const card = document.getElementById('searchDetailModalCard');
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

		function openEditAdminModalForManage(adminName) {
			showLoading(true, &quot;กำลังดึงข้อมูลบัญชี...&quot;);
			fetch(WEB_APP_URL, {
				method: 'POST',
				body: JSON.stringify({ action: 'get_admin_info', adminName: adminName, token: sessionStorage.getItem('token') })
			})
			.then(res => res.json())
			.then(result => {
				showLoading(false);
				if(result.status === 'success') {
					const data = result.data;
					document.getElementById('editAdminNameInput').value = data.name;
					document.getElementById('editAdminNameInput').readOnly = true; // ชื่อห้ามเปลี่ยนใช้เป็นตัวอ้างอิง
					document.getElementById('editAdminNameInput').classList.add('bg-gray-50');
					
					document.getElementById('editAdminDeptInput').value = data.dept || '';
					document.getElementById('editAdminUsernameInput').value = data.username || '';
					document.getElementById('editAdminPwdInput').value = data.password || '';
					
					// แอดมินสามารถเปลี่ยน Role ของคนอื่นได้
					const roleInput = document.getElementById('editAdminRoleInput');
					roleInput.value = data.role || 'user';
					
					// กรณีเป็นตัวเอง ห้ามเปลี่ยน Role ของตัวเองเพื่อป้องกันหลุดสิทธิ์
					if (data.name === sessionStorage.getItem('name')) {
						roleInput.disabled = true;
						roleInput.classList.add('bg-gray-100', 'cursor-not-allowed', 'pointer-events-none');
					} else {
						roleInput.disabled = false;

<script>
var loadingInterval = null;
function showLoading(show, text = &quot;กำลังโหลดข้อมูล...&quot;) {
			const overlay = document.getElementById('loading-overlay');
			const bar = document.getElementById('loading-progress-bar');
			const msg = document.getElementById('loading-text-msg');

			if (show) {
				if (msg) msg.innerText = text;
				if (overlay) overlay.style.display = 'flex';
				
				let width = 0;
				if (bar) { bar.style.width = '0%'; bar.innerText = '0%'; }
				if (loadingInterval) clearInterval(loadingInterval);
				
				loadingInterval = setInterval(() => {
					if (width < 90) width += Math.random() * 5;
					else if (width < 98) width += 0.2;
					if (bar) { bar.style.width = width + '%'; bar.innerText = Math.round(width) + '%'; }
				}, 200);
			} else {
				if (loadingInterval) clearInterval(loadingInterval);
				if (bar) { bar.style.width = '100%'; bar.innerText = '100%'; }
				setTimeout(() => { if (overlay) overlay.style.display = 'none'; }, 500);
			}
		}
function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass, iconClass;
            switch(type) {
                case 'success': bgClass = 'bg-[#198754] text-white'; iconClass = 'fa-solid fa-circle-check'; break;
                case 'error': bgClass = 'bg-[#dc3545] text-white'; iconClass = 'fa-solid fa-triangle-exclamation'; break;
                default: bgClass = 'bg-[#0d6efd] text-white'; iconClass = 'fa-solid fa-circle-info';
            }

            toast.className = `${bgClass} px-5 py-3 rounded-md shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 flex items-center gap-3 font-medium text-sm pointer-events-auto`;
            toast.innerHTML = `<i class=&quot;${iconClass} text-lg&quot;></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
